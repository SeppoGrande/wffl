const lsGet = k => { try { return JSON.parse(localStorage.getItem(k)); } catch(e){ return null; } };
const lsSet = (k,v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} };
const r2 = n => Math.round((n||0)*100)/100;

async function loadSeason(id, current){
  if (!current){ const c = lsGet(HKEY+id); if (c && c.v === 3) return c; }
  const [lg, users, rosters] = await Promise.all([j(`${API}/league/${id}`), j(`${API}/league/${id}/users`), j(`${API}/league/${id}/rosters`)]);
  const done = lg.status === "complete";
  const pStart = (lg.settings && lg.settings.playoff_week_start) || 15;
  const last = current ? Math.min(S.week - 1, pStart - 1) : pStart - 1;   // regular season, completed weeks only
  const weeks = []; for (let w = 1; w <= last; w++) weeks.push(w);
  const poWeeks = done ? [0, 1, 2, 3].map(k => pStart + k) : [];
  const txWeeks = []; for (let w = 1; w <= (done ? 18 : Math.max(1, S.week)); w++) txWeeks.push(w);
  const opt = u => j(u).catch(() => null);
  const [data, poData, txData, picks] = await Promise.all([
    Promise.all(weeks.map(w => opt(`${API}/league/${id}/matchups/${w}`))),
    Promise.all(poWeeks.map(w => opt(`${API}/league/${id}/matchups/${w}`))),
    Promise.all(txWeeks.map(w => opt(`${API}/league/${id}/transactions/${w}`))),
    lg.draft_id ? opt(`${API}/draft/${lg.draft_id}/picks`) : Promise.resolve(null)
  ]);
  const owner = {}; rosters.forEach(r => owner[r.roster_id] = r.owner_id || `r${r.roster_id}`);
  const O = rid => owner[rid] || `r${rid}`;
  const names = {}; users.forEach(u => names[u.user_id] = { dn: u.display_name || "", team: ((u.metadata && u.metadata.team_name) || "").trim() });

  // positions of everyone rostered this season (for the optimal lineup)
  const ids = new Set(); data.forEach(ms => (ms || []).forEach(m => Object.keys(m.players_points || {}).forEach(p => ids.add(p))));
  await ensurePlayers([...ids]);
  const slots = lineupSlots(lg.roster_positions);

  // regular season games and scores; starter points per week/roster/player; player points while rostered
  // score row: [week, owner, points, bench, top starter, optimal lineup, zero-point starters, kicker pts, worst DEF [pts, pid]]
  const games = []; let scores = []; const stp = {}; const ppTot = {}; const starts = {};
  data.forEach((ms, i) => {
    const w = weeks[i], by = {}; stp[w] = {};
    (ms || []).forEach(m => {
      const p = r2(m.points), st = new Set(m.starters || []); const sp = (stp[w][m.roster_id] = {});
      let bench = 0; Object.entries(m.players_points || {}).forEach(([pid, v]) => { ppTot[pid] = (ppTot[pid] || 0) + (v || 0); if (!st.has(pid)) bench += v || 0; });
      let top = null, kick = 0, def = null; const zeros = [], so = (starts[O(m.roster_id)] ||= {});
      (m.starters || []).forEach((pid, k) => { const v = (m.starters_points || [])[k] || 0;
        if (!pid || pid === "0") { zeros.push("0"); return; }
        sp[pid] = v; so[pid] = (so[pid] || 0) + 1; if (!top || v > top[1]) top = [pid, r2(v)];
        if (!v) zeros.push(pid);
        if (slots[k] === "K") kick += v;
        if (slots[k] === "DEF" && (!def || v < def[0])) def = [r2(v), pid]; });
      if (m.matchup_id != null) (by[m.matchup_id] ||= []).push({ o: O(m.roster_id), p });
      scores.push([w, O(m.roster_id), p, r2(bench), top, r2(Math.max(p, optimalPts(slots, m.players_points))), zeros, r2(kick), def]);
    });
    Object.values(by).forEach(g => { if (g.length === 2 && (g[0].p || g[1].p)) games.push([w, g[0].o, g[0].p, g[1].o, g[1].p]); });
  });
  const played = new Set(games.map(g => g[0])); scores = scores.filter(s => played.has(s[0]));
  const after = (rid, pid, fromW) => r2(weeks.filter(w => w >= fromW).reduce((s, w) => s + (((stp[w] || {})[rid] || {})[pid] || 0), 0));

  // playoffs: winners bracket + points of playoff weeks
  let champ = null, second = null, bracket = [];
  if (done){
    const br = await opt(`${API}/league/${id}/winners_bracket`);
    const pts = {}; poData.forEach((ms, k) => (ms || []).forEach(m => pts[`${poWeeks[k]}-${m.roster_id}`] = r2(m.points)));
    (br || []).forEach(x => { if (typeof x.t1 !== "number" || typeof x.t2 !== "number") return; const w = pStart + x.r - 1;
      bracket.push({ r: x.r, p: x.p || 0, w, a: O(x.t1), b: O(x.t2), pa: pts[`${w}-${x.t1}`] ?? null, pb: pts[`${w}-${x.t2}`] ?? null, win: x.w ? O(x.w) : null });
      if (x.p === 1 && x.w){ champ = O(x.w); second = O(x.l); } });
  }

  // transactions
  const trades = [], adds = [], drops = [], moves = {};
  const mv = o => (moves[o] ||= { trade: 0, waiver: 0, fa: 0, faab: 0 });
  txData.forEach(list => (list || []).forEach(t => {
    if (t.status !== "complete") return; const w = t.leg || 1;
    if (t.type === "trade"){
      const sides = (t.roster_ids || []).map(rid => { const got = Object.entries(t.adds || {}).filter(([, r]) => r === rid).map(([pid]) => pid);
        const picksGot = (t.draft_picks || []).filter(d => d.owner_id === rid).length;
        return { o: O(rid), got, picks: picksGot, pts: r2(got.reduce((s, pid) => s + after(rid, pid, w), 0)) }; });
      sides.forEach(s => mv(s.o).trade++); if (sides.length >= 2) trades.push({ w, sides });
    } else if (t.type === "waiver" || t.type === "free_agent"){
      const bid = (t.settings && t.settings.waiver_bid) || 0;
      Object.entries(t.adds || {}).forEach(([pid, rid]) => { const o = O(rid); const m = mv(o); if (t.type === "waiver") m.waiver++; else m.fa++; m.faab += bid;
        adds.push({ o, pid, w, type: t.type, bid, pts: after(rid, pid, w) }); });
      Object.entries(t.drops || {}).forEach(([pid, rid]) => drops.push({ o: O(rid), pid, w }));
    }
  }));
  // dropped, then picked up by another manager: starter points for the new team
  const regrets = drops.map(d => { const a = adds.filter(a => a.pid === d.pid && a.o !== d.o && a.w >= d.w).sort((x, y) => x.w - y.w)[0];
      return a && a.pts > 0 ? { o: d.o, pid: d.pid, w: d.w, to: a.o, w2: a.w, pts: a.pts } : null; })
    .filter(Boolean).sort((a, b) => b.pts - a.pts).slice(0, 15);
  const topAdds = [...adds].sort((a, b) => b.pts - a.pts).slice(0, 12);
  const topBids = adds.filter(a => a.bid > 0).sort((a, b) => b.bid - a.bid).slice(0, 8);

  // draft
  const pn = {};
  const draft = (picks || []).map(p => { const md = p.metadata || {}; if (md.last_name) pn[p.player_id] = [`${(md.first_name || "")[0] || ""}. ${md.last_name}`.trim(), md.position || ""];
    return { rd: p.round, no: p.pick_no, o: p.roster_id ? O(p.roster_id) : (p.picked_by || "?"), pid: p.player_id, pts: r2(ppTot[p.player_id] || 0) }; });

  const s = { v: 3, id, season: String(lg.season || ""), prev: lg.previous_league_id, status: lg.status, names, games, scores, champ, second, bracket,
    trades, topAdds, topBids, moves, draft, pn, regrets, starts, nTx: trades.length + adds.length };
  if (!current && done) lsSet(HKEY+id, s);
  return s;
}
async function loadHistory(){
  try {
    const out = [], seen = new Set(); let id = LEAGUE;
    while (id && id !== "0" && !seen.has(id) && seen.size < 25){ seen.add(id); const s = await loadSeason(id, id === LEAGUE); out.push(s); id = s.prev; }
    S.hist = out.reverse(); computeFacts();
  } catch(e){}
}

/* ---------- facts ---------- */
function computeFacts(){
  const H = S.hist; if (!H || !H.length) return;
  const nm = {}; H.forEach(s => Object.entries(s.names).forEach(([o, v]) => { if (v.dn) nm[o] = v.dn; }));
  const N = o => nm[o] || "Unbekannt";
  const tm = (s, o) => (s.names[o] && s.names[o].team) || "";
  const SC = [], G = [];
  H.forEach((s, si) => {
    s.scores.forEach(([w, o, p, bench, top, opt, zeros, kick, def]) => SC.push({ s, si, w, o, p, bench, top, opt: opt || p, zeros: zeros || [], kick: kick || 0, def: def || null }));
    s.games.forEach(([w, a, pa, b, pb]) => G.push({ s, si, w, a, pa, b, pb, d: r2(Math.abs(pa - pb)) }));
  });
  if (!G.length) { S.facts = []; return; }
  const cur = H.length - 1;
  const when = x => `Woche ${x.w} · ${x.s.season}`;
  const span = H.length > 1 ? `${H[0].season}–${H[cur].season}` : H[0].season;
  S.histSpan = span;
  const rec = (w, l, t) => `${w}‑${l}${t ? "‑" + t : ""}`;   // non-breaking hyphen
  const pct = (w, t, g) => g ? Math.round((w + t/2) / g * 100) : 0;
  const F = [];

  // per-week ranking and median
  const wk = x => `${x.si}-${x.w}`;
  const byWeek = {}; SC.forEach(x => (byWeek[wk(x)] ||= []).push(x.p));
  Object.values(byWeek).forEach(a => a.sort((x, y) => y - x));
  const median = k => { const a = byWeek[k], n = a.length; return n % 2 ? a[(n-1)/2] : (a[n/2-1] + a[n/2]) / 2; };

  // per-owner game log, chronological
  const res = {};
  G.sort((x, y) => x.si - y.si || x.w - y.w).forEach(g => {
    [[g.a, g.pa, g.b, g.pb], [g.b, g.pb, g.a, g.pa]].forEach(([o, pf, opp, pa]) =>
      (res[o] ||= []).push({ g, s: g.s, si: g.si, w: g.w, o, pf, pa, opp, won: pf > pa, tie: pf === pa }));
  });
  const owners = Object.keys(res);
  const all = owners.flatMap(o => res[o]);
  const wl = o => { const r = res[o]; const w = r.filter(x => x.won).length, t = r.filter(x => x.tie).length; return { w, t, l: r.length - w - t, g: r.length }; };

  // 1 highest score ever
  const hi = [...SC].sort((a, b) => b.p - a.p);
  F.push(() => ({ kick: "Allzeit-Rekord · Höchster Wochenscore", title: `Den höchsten Wochenscore der WFFL-Geschichte hält ${N(hi[0].o)}`,
    sub: `${when(hi[0])}${tm(hi[0].s, hi[0].o) ? " · als „" + tm(hi[0].s, hi[0].o) + "“" : ""}. Ausgewertet: alle Hauptrunden-Wochen ${span}.`,
    num: f1(hi[0].p), unit: "Punkte", box: "Top 5 Wochenscores",
    rows: hi.slice(0, 5).map(x => ({ who: N(x.o), small: when(x), v: f1(x.p) })) }));

  // 2 lowest score ever
  const lo = SC.filter(x => x.p > 0).sort((a, b) => a.p - b.p);
  if (lo.length) F.push(() => ({ kick: "Allzeit-Tiefpunkt", title: `Der schwächste Auftritt aller Zeiten: ${N(lo[0].o)} mit nur ${f1(lo[0].p)} Punkten`,
    sub: `${when(lo[0])}. Der Liga-Schnitt in dieser Woche lag bei ${f1(median(wk(lo[0])))} Punkten (Median).`,
    num: f1(lo[0].p), unit: "Punkte", box: "Die 5 schwächsten Wochen",
    rows: lo.slice(0, 5).map(x => ({ who: N(x.o), small: when(x), v: f1(x.p) })) }));

  // 3 biggest blowout / 4 closest game
  const WL = g => g.pa >= g.pb ? [g.a, g.pa, g.b, g.pb] : [g.b, g.pb, g.a, g.pa];
  const bl = [...G].sort((a, b) => b.d - a.d);
  F.push(() => { const [w, pw, l, pl] = WL(bl[0]); return { kick: "Höchster Sieg aller Zeiten", title: `${N(w)} überrollte ${N(l)} mit ${f1(pw)} zu ${f1(pl)}`,
    sub: `${when(bl[0])}. So deutlich ist in der WFFL nie wieder ein Duell ausgegangen.`, num: f1(bl[0].d), unit: "Punkte Abstand", box: "Die 5 deutlichsten Siege",
    rows: bl.slice(0, 5).map(g => { const [a, , b] = WL(g); return { who: `${N(a)} – ${N(b)}`, small: when(g), v: f1(g.d) }; }) }; });
  const cl = G.filter(g => g.d > 0).sort((a, b) => a.d - b.d); const ties = G.filter(g => g.d === 0).length;
  if (cl.length) F.push(() => { const [w, pw, l, pl] = WL(cl[0]); return { kick: "Knappstes Duell aller Zeiten", title: `${N(w)} gewann gegen ${N(l)} mit ${f1(pw)} zu ${f1(pl)}`,
    sub: `${when(cl[0])}. ${ties ? `Dazu ${ties} Unentschieden in der Liga-Geschichte.` : "Ein einziger Extrapunkt hätte alles gedreht."}`, num: f1(cl[0].d), unit: "Punkte Abstand", box: "Die 5 knappsten Duelle",
    rows: cl.slice(0, 5).map(g => { const [a, , b] = WL(g); return { who: `${N(a)} – ${N(b)}`, small: when(g), v: f1(g.d) }; }) }; });

  // 5 most points in a loss / 6 fewest points in a win
  const ls = all.filter(x => !x.won && !x.tie).sort((a, b) => b.pf - a.pf);
  if (ls.length) F.push(() => ({ kick: "Pech pur · Meiste Punkte in einer Niederlage", title: `${N(ls[0].o)} holte ${f1(ls[0].pf)} Punkte und verlor trotzdem`,
    sub: `${when(ls[0])} gegen ${N(ls[0].opp)}, die ${f1(ls[0].pa)} Punkte auflegten. Mit diesem Score hätte ${N(ls[0].o)} in dieser Woche ${byWeek[wk(ls[0])].filter(p => p < ls[0].pf).length} von ${byWeek[wk(ls[0])].length - 1} anderen Teams geschlagen.`,
    num: f1(ls[0].pf), unit: "Punkte", box: "Die bittersten Niederlagen",
    rows: ls.slice(0, 5).map(x => ({ who: N(x.o), small: `${when(x)} · gegen ${N(x.opp)}`, v: f1(x.pf) })) }));
  const ws = all.filter(x => x.won).sort((a, b) => a.pf - b.pf);
  if (ws.length) F.push(() => ({ kick: "Dusel des Jahrhunderts · Wenigste Punkte bei einem Sieg", title: `${N(ws[0].o)} gewann mit nur ${f1(ws[0].pf)} Punkten`,
    sub: `${when(ws[0])}: ${N(ws[0].opp)} kam auf noch weniger, nämlich ${f1(ws[0].pa)} Punkte.`, num: f1(ws[0].pf), unit: "Punkte", box: "Die glücklichsten Siege",
    rows: ws.slice(0, 5).map(x => ({ who: N(x.o), small: `${when(x)} · gegen ${N(x.opp)}`, v: f1(x.pf) })) }));

  // 7 streaks
  const streak = (arr, test) => { let best = { len: 0 }, n = 0, from = null;
    arr.forEach(r => { if (test(r)) { if (!n) from = r; n++; if (n > best.len) best = { len: n, from, to: r }; } else n = 0; });
    return { best, active: n, from: n ? from : null }; };
  const sw = owners.map(o => ({ o, ...streak(res[o], r => r.won) })).sort((a, b) => b.best.len - a.best.len);
  const sl = owners.map(o => ({ o, ...streak(res[o], r => !r.won && !r.tie) })).sort((a, b) => b.best.len - a.best.len);
  const span2 = b => b.from.si === b.to.si ? `Woche ${b.from.w}–${b.to.w} · ${b.to.s.season}` : `W${b.from.w} ${b.from.s.season} bis W${b.to.w} ${b.to.s.season}`;
  if (sw[0] && sw[0].best.len >= 3) F.push(() => ({ kick: "Längste Siegesserie", title: `${N(sw[0].o)} gewann ${sw[0].best.len} Spiele am Stück`,
    sub: `${span2(sw[0].best)}. Serien zählen auch über Saisongrenzen hinweg (nur Hauptrunde).`, num: sw[0].best.len, unit: "Siege in Folge", box: "Die längsten Siegesserien",
    rows: sw.slice(0, 5).map(x => ({ who: N(x.o), small: span2(x.best), v: x.best.len })) }));
  if (sl[0] && sl[0].best.len >= 3) F.push(() => ({ kick: "Längste Durststrecke", title: `${N(sl[0].o)} verlor ${sl[0].best.len} Spiele in Folge`,
    sub: `${span2(sl[0].best)}. Serien zählen auch über Saisongrenzen hinweg (nur Hauptrunde).`, num: sl[0].best.len, unit: "Niederlagen in Folge", box: "Die längsten Niederlagenserien",
    rows: sl.slice(0, 5).map(x => ({ who: N(x.o), small: span2(x.best), v: x.best.len })) }));
  const hot = sw.filter(x => x.active >= 3 && res[x.o][res[x.o].length - 1].si === cur).sort((a, b) => b.active - a.active);
  if (hot.length) F.push(() => ({ kick: "Serie läuft", title: `${N(hot[0].o)} hat die letzten ${hot[0].active} Spiele alle gewonnen`,
    sub: `Seit Woche ${hot[0].from.w} · ${hot[0].from.s.season}. ${hot[0].active >= sw[0].best.len ? "Das ist der Allzeit-Rekord – jeder weitere Sieg baut ihn aus." : `Allzeit-Rekord: ${sw[0].best.len} (${N(sw[0].o)}).`}`,
    num: hot[0].active, unit: "Siege in Folge", box: "Aktive Siegesserien", rows: hot.slice(0, 5).map(x => ({ who: N(x.o), small: `seit Woche ${x.from.w} · ${x.from.s.season}`, v: x.active })) }));
  const cold = sl.filter(x => x.active >= 3 && res[x.o][res[x.o].length - 1].si === cur).sort((a, b) => b.active - a.active);
  if (cold.length) F.push(() => ({ kick: "Im Keller", title: `${N(cold[0].o)} wartet seit ${cold[0].active} Spielen auf einen Sieg`,
    sub: `Letzter Sieg vor Woche ${cold[0].from.w} · ${cold[0].from.s.season}. Allzeit-Negativrekord: ${sl[0].best.len} (${N(sl[0].o)}).`,
    num: cold[0].active, unit: "Niederlagen in Folge", box: "Aktive Niederlagenserien", rows: cold.slice(0, 5).map(x => ({ who: N(x.o), small: `seit Woche ${x.from.w} · ${x.from.s.season}`, v: x.active })) }));

  // 8 bad luck / good luck vs. weekly median
  const unl = owners.map(o => ({ o, n: res[o].filter(x => !x.won && !x.tie && x.pf > median(wk(x))).length, g: res[o].length })).sort((a, b) => b.n - a.n);
  const lck = owners.map(o => ({ o, n: res[o].filter(x => x.won && x.pf < median(wk(x))).length, g: res[o].length })).sort((a, b) => b.n - a.n);
  if (unl[0] && unl[0].n) F.push(() => ({ kick: "Pechvogel-Index", title: `${N(unl[0].o)} hat ${unl[0].n}-mal verloren, obwohl die Punkte zur oberen Hälfte der Woche gehörten`,
    sub: `Gezählt: Niederlagen mit einem Score über dem Median aller Teams in derselben Woche · ${span}.`, num: unl[0].n, unit: "unverdiente Niederlagen", box: "Unverdiente Niederlagen",
    rows: unl.slice(0, 6).map(x => ({ who: N(x.o), small: `in ${x.g} Spielen`, v: x.n })) }));
  if (lck[0] && lck[0].n) F.push(() => ({ kick: "Glückspilz-Index", title: `${N(lck[0].o)} hat ${lck[0].n}-mal gewonnen, obwohl der Score unter dem Wochenschnitt lag`,
    sub: `Gezählt: Siege mit einem Score unter dem Median aller Teams in derselben Woche · ${span}.`, num: lck[0].n, unit: "glückliche Siege", box: "Glückliche Siege",
    rows: lck.slice(0, 6).map(x => ({ who: N(x.o), small: `in ${x.g} Spielen`, v: x.n })) }));
  const second = all.filter(x => !x.won && !x.tie && byWeek[wk(x)].length > 2 && x.pf === byWeek[wk(x)][1]);
  if (second.length) F.push(() => ({ kick: "Kurios", title: `${second.length}-mal hat der zweitbeste Score einer Woche nicht zum Sieg gereicht`,
    sub: "Der Gegner war jeweils das einzige Team, das in dieser Woche noch mehr Punkte geholt hat.", num: second.length, unit: "mal", box: "Die Fälle",
    rows: second.slice(-6).reverse().map(x => ({ who: `${N(x.o)} gegen ${N(x.opp)}`, small: when(x), v: `${f1(x.pf)}` })) }));

  // 9 all-play luck
  const ap = owners.map(o => { let exp = 0; res[o].forEach(x => { const a = byWeek[wk(x)]; const n = a.length - 1; if (n > 0) exp += (a.filter(p => p < x.pf).length + (a.filter(p => p === x.pf).length - 1) / 2) / n; });
    const r = wl(o); return { o, exp, act: r.w + r.t/2, luck: r.w + r.t/2 - exp }; }).sort((a, b) => b.luck - a.luck);
  const sg = n => (n >= 0 ? "+" : "−") + Math.abs(n).toFixed(1);
  if (ap.length > 2) {
    F.push(() => ({ kick: "Glücksfaktor · Allzeit", title: `${N(ap[0].o)} hat ${ap[0].luck.toFixed(1)} Siege mehr geholt, als die eigenen Punkte hergeben`,
      sub: "Erwartete Siege: als hätte jedes Team jede Woche gegen alle anderen gespielt. Die Differenz zu den echten Siegen ist reines Spielplan-Glück.",
      num: sg(ap[0].luck), unit: "Siege über Erwartung", box: "Glück (+) und Pech (−) im Spielplan",
      rows: [...ap.slice(0, 3), ...ap.slice(-3)].filter((x, i, a) => a.indexOf(x) === i).map(x => ({ who: N(x.o), small: `${x.act} Siege · erwartet ${x.exp.toFixed(1)}`, v: sg(x.luck) })) }));
    const z = ap[ap.length - 1];
    F.push(() => ({ kick: "Vom Spielplan bestraft", title: `${N(z.o)} fehlen ${Math.abs(z.luck).toFixed(1)} Siege, die die Punkte eigentlich verdient hätten`,
      sub: `Echte Siege: ${z.act} · bei Spielen gegen die ganze Liga erwartet: ${z.exp.toFixed(1)}. Kein Manager hatte mehr Pech mit den Gegnern.`,
      num: sg(z.luck), unit: "Siege unter Erwartung" }));
  }

  // 10 champions (Sleeper + pre-Sleeper era)
  const t2o = {}; H.forEach(s => Object.entries(s.names).forEach(([o, v]) => { if (v.team) t2o[v.team.toLowerCase()] = o; }));
  const sleeperYears = new Set(H.map(s => s.season));
  const legacy = LEGACY_CHAMPS.filter(c => !sleeperYears.has(c.season)).map(c => ({ season: c.season, team: c.team, now: c.now, o: t2o[(c.now || c.team).toLowerCase()] || t2o[c.team.toLowerCase()] || null }));
  const ch = [...legacy.map(c => ({ season: c.season, o: c.o, label: c.o ? N(c.o) : c.team, small: c.o ? (c.now ? `${c.team} (heute ${c.now})` : c.team) : (c.now ? `heute ${c.now}` : "vor Sleeper"), legacy: true })),
              ...H.filter(s => s.champ).map(s => ({ season: s.season, o: s.champ, label: N(s.champ), small: s.second ? `Finale gegen ${N(s.second)}` : "" }))]
    .sort((a, b) => a.season.localeCompare(b.season));
  if (ch.length) {
    const cnt = {}; ch.forEach(c => { const k = c.o || "team:" + c.label; cnt[k] = (cnt[k] || 0) + 1; });
    const best = Object.entries(cnt).sort((a, b) => b[1] - a[1])[0];
    const bestName = best[0].startsWith("team:") ? best[0].slice(5) : N(best[0]);
    F.push(() => ({ kick: "Ehrentafel · seit 2017/18", title: best[1] > 1 ? `${bestName} ist WFFL-Rekordmeister mit ${best[1]} Titeln` : `${ch.length} Meister, ${Object.keys(cnt).length} verschiedene Champions`,
      sub: `Bis ${legacy.length ? legacy[legacy.length - 1].season : ""} spielte die WFFL auf einer anderen App – von dort sind nur die Meister überliefert.${H.filter(s => s.champ).length ? " Ab dann laut Sleeper-Playoff-Baum." : ""}`.replace("Bis  spielte", "Vor Sleeper spielte"),
      num: best[1], unit: best[1] > 1 ? "Titel" : "Titel pro Meister", box: "Alle Meister",
      rows: [...ch].reverse().slice(0, 10).map(c => ({ who: c.label, small: c.small, v: c.season })) }));
  }
  const curYear = parseInt(H[cur].season, 10);
  if (curYear) F.push(() => ({ kick: "Liga-Chronik", title: `Die Werdenfelser Fantasy-Football-Liga spielt ihre ${curYear - FOUNDED + 1}. Saison`,
    sub: `Gegründet zur Saison 2017/18. Die ersten Jahre auf einer anderen App, seit ${H[0].season} auf Sleeper.`,
    num: curYear - FOUNDED + 1, unit: "Saisons", box: "In Zahlen (seit Sleeper)",
    rows: [{ who: "Hauptrundenspiele", v: G.length }, { who: "Punkte erzielt", v: Math.round(SC.reduce((s, x) => s + x.p, 0)).toLocaleString("de-DE") },
      { who: "Trades", v: H.reduce((s, x) => s + (x.trades || []).length, 0) }, { who: "Waiver- & Free-Agent-Moves", v: H.reduce((s, x) => s + Object.values(x.moves || {}).reduce((a, m) => a + m.waiver + m.fa, 0), 0) },
      { who: "Meister", small: "inkl. Zeit vor Sleeper", v: ch.length }] }));

  // player names: built-in list, then names from draft data
  const PN = {}; H.forEach(s => Object.assign(PN, s.pn || {}));
  const pName = pid => (PLAYERS[pid] && PLAYERS[pid][0]) || (PN[pid] && PN[pid][0]) || `Spieler #${pid}`;
  const pPos = pid => (PLAYERS[pid] && PLAYERS[pid][1]) || (PN[pid] && PN[pid][1]) || "";
  const whenS = (s, w) => `Woche ${w} · ${s.season}`;
  const list = a => a.length > 2 ? a.slice(0, 2).join(", ") + ` +${a.length - 2}` : a.join(", ");

  // 20 trades
  const TR = H.flatMap(s => (s.trades || []).map(t => ({ s, ...t })));
  const mvTot = {}; H.forEach(s => Object.entries(s.moves || {}).forEach(([o, m]) => { const x = (mvTot[o] ||= { trade: 0, waiver: 0, fa: 0, faab: 0 }); x.trade += m.trade; x.waiver += m.waiver; x.fa += m.fa; x.faab += m.faab; }));
  const tk = Object.entries(mvTot).map(([o, m]) => ({ o, ...m })).sort((a, b) => b.trade - a.trade);
  if (TR.length && tk[0].trade) F.push(() => ({ kick: "Trade-König", title: `${N(tk[0].o)} war an ${tk[0].trade} von ${TR.length} Trades der Liga beteiligt`,
    sub: `Alle abgeschlossenen Trades seit ${H[0].season}.`, num: tk[0].trade, unit: "Trades", box: "Die aktivsten Händler",
    rows: tk.filter(x => x.trade).slice(0, 6).map(x => ({ who: N(x.o), small: "", v: x.trade })) }));
  const td = TR.filter(t => t.sides.length === 2 && (t.sides[0].got.length || t.sides[1].got.length)).map(t => { const [a, b] = [...t.sides].sort((x, y) => y.pts - x.pts); return { ...t, win: a, lose: b, d: r2(a.pts - b.pts) }; }).sort((a, b) => b.d - a.d);
  if (td.length && td[0].d > 0) F.push(() => { const t = td[0]; return { kick: "Bester Trade aller Zeiten", title: `${N(t.win.o)} zog ${N(t.lose.o)} über den Tisch – mit ${f1(t.d)} Punkten Vorsprung`,
    sub: `${whenS(t.s, t.w)}. ${N(t.win.o)} bekam ${list(t.win.got.map(pName)) || "Draft-Picks"}, ${N(t.lose.o)} bekam ${list(t.lose.got.map(pName)) || "Draft-Picks"}. Gezählt: Starter-Punkte der erhaltenen Spieler für das neue Team bis Ende der Hauptrunde.`,
    num: "+" + f1(t.d), unit: "Punkte Differenz", box: "Die einseitigsten Trades",
    rows: td.slice(0, 5).map(x => ({ who: `${N(x.win.o)} vs. ${N(x.lose.o)}`, small: `${whenS(x.s, x.w)} · ${list(x.win.got.map(pName))}`, v: "+" + f1(x.d) })) }; });

  // 21 waiver wire
  const AD = H.flatMap(s => (s.topAdds || []).map(a => ({ s, ...a }))).sort((a, b) => b.pts - a.pts);
  if (AD.length && AD[0].pts > 0) F.push(() => { const a = AD[0]; return { kick: "Waiver-Juwel", title: `${pName(a.pid)} – der beste Pickup aller Zeiten, geholt von ${N(a.o)}`,
    sub: `${whenS(a.s, a.w)} ${a.type === "waiver" ? "über die Waiver" : "als Free Agent"}${a.bid ? ` für $${a.bid} FAAB` : ""}. Danach ${f1(a.pts)} Punkte als Starter bis Ende der Hauptrunde.`,
    num: f1(a.pts), unit: "Starter-Punkte", box: "Die besten Pickups",
    rows: AD.slice(0, 5).map(x => ({ who: `${pName(x.pid)}${pPos(x.pid) ? " · " + pPos(x.pid) : ""}`, small: `${N(x.o)} · ${whenS(x.s, x.w)}`, v: f1(x.pts) })) }; });
  const wk2 = Object.entries(mvTot).map(([o, m]) => ({ o, n: m.waiver + m.fa, ...m })).sort((a, b) => b.n - a.n);
  if (wk2.length && wk2[0].n) F.push(() => ({ kick: "Dauergast am Waiver-Draht", title: `${N(wk2[0].o)} hat ${wk2[0].n} Spieler über Waiver und Free Agency geholt`,
    sub: `Seit ${H[0].season}. ${wk2[wk2.length - 1].n < wk2[0].n / 3 ? `Zum Vergleich: ${N(wk2[wk2.length - 1].o)} kam auf nur ${wk2[wk2.length - 1].n}.` : ""}`,
    num: wk2[0].n, unit: "Pickups", box: "Die meisten Pickups", rows: wk2.slice(0, 6).map(x => ({ who: N(x.o), small: `${x.waiver} Waiver · ${x.fa} Free Agent${x.faab ? ` · $${x.faab} FAAB` : ""}`, v: x.n })) }));
  const BD = H.flatMap(s => (s.topBids || []).map(a => ({ s, ...a }))).sort((a, b) => b.bid - a.bid);
  if (BD.length) F.push(() => { const a = BD[0]; return { kick: "Teuerster Waiver-Pickup", title: `${N(a.o)} bot $${a.bid} für ${pName(a.pid)}`,
    sub: `${whenS(a.s, a.w)}. Ausbeute danach: ${f1(a.pts)} Starter-Punkte bis Ende der Hauptrunde${a.pts ? ` – das sind ${f1(a.pts / a.bid)} Punkte pro FAAB-Dollar` : " – kein einziger Punkt"}.`,
    num: "$" + a.bid, unit: "FAAB", box: "Die höchsten Gebote", rows: BD.slice(0, 5).map(x => ({ who: pName(x.pid), small: `${N(x.o)} · ${whenS(x.s, x.w)} · ${f1(x.pts)} Pkt.`, v: "$" + x.bid })) }; });

  // 22 draft
  const DR = H.flatMap(s => (s.draft || []).filter(p => p.pid).map(p => ({ s, ...p })));
  const dPast = DR.filter(p => p.s.status === "complete");
  if (dPast.length) {
    const rounds = Math.max(...dPast.map(p => p.rd));
    const steal = dPast.filter(p => p.rd > rounds / 2).sort((a, b) => b.pts - a.pts);
    const bust = dPast.filter(p => p.rd <= 2).sort((a, b) => a.pts - b.pts);
    const dl = p => `Runde ${p.rd}, Pick ${p.no} · ${N(p.o)} · ${p.s.season}`;
    if (steal.length) F.push(() => ({ kick: "Draft-Steal aller Zeiten", title: `${pName(steal[0].pid)} kam erst in Runde ${steal[0].rd} – und lieferte ${f1(steal[0].pts)} Punkte`,
      sub: `${dl(steal[0])}. Gezählt: Punkte in der Hauptrunde, solange der Spieler in einem WFFL-Kader stand.`, num: f1(steal[0].pts), unit: "Punkte", box: `Die besten Picks ab Runde ${Math.floor(rounds / 2) + 1}`,
      rows: steal.slice(0, 5).map(p => ({ who: `${pName(p.pid)}${pPos(p.pid) ? " · " + pPos(p.pid) : ""}`, small: dl(p), v: f1(p.pts) })) }));
    if (bust.length) F.push(() => ({ kick: "Draft-Bust aller Zeiten", title: `${pName(bust[0].pid)}: Pick ${bust[0].no}, aber nur ${f1(bust[0].pts)} Punkte`,
      sub: `${dl(bust[0])}. Der schwächste Ertrag aller Erst- und Zweitrunden-Picks (Hauptrunde, solange in einem WFFL-Kader).`, num: f1(bust[0].pts), unit: "Punkte", box: "Die teuersten Fehlgriffe (Runde 1–2)",
      rows: bust.slice(0, 5).map(p => ({ who: `${pName(p.pid)}${pPos(p.pid) ? " · " + pPos(p.pid) : ""}`, small: dl(p), v: f1(p.pts) })) }));
    const cls = {}; dPast.forEach(p => { const k = p.s.season + "|" + p.o; (cls[k] ||= { s: p.s, o: p.o, pts: 0 }).pts += p.pts; });
    const cl2 = Object.values(cls).sort((a, b) => b.pts - a.pts);
    if (cl2.length > 2) F.push(() => ({ kick: "Bester Draft-Jahrgang", title: `${N(cl2[0].o)} hat ${cl2[0].s.season} den besten Draft der Liga-Geschichte hingelegt`,
      sub: "Summe der Hauptrunden-Punkte aller gedrafteten Spieler eines Managers in einer Saison.", num: f1(cl2[0].pts), unit: "Punkte", box: "Die stärksten Draft-Klassen",
      rows: cl2.slice(0, 5).map(x => ({ who: N(x.o), small: x.s.season, v: f1(x.pts) })) }));
    const firsts = H.map(s => (s.draft || []).find(p => p.no === 1)).filter(Boolean).map(p => ({ ...p, s: H.find(s => (s.draft || []).includes(p)) }));
    if (firsts.length > 1) F.push(() => ({ kick: "Die Nummer-1-Picks", title: `Wer zuerst zieht, ist noch lange nicht Meister`,
      sub: `Alle Erstrunden-Picks an Position 1 seit ${H[0].season} und was sie gebracht haben.`, box: "Pick 1 jeder Saison",
      rows: [...firsts].reverse().slice(0, 7).map(p => ({ who: `${pName(p.pid)}${pPos(p.pid) ? " · " + pPos(p.pid) : ""}`, small: `${N(p.o)} · ${p.s.season}${p.s.champ === p.o ? " · Meister!" : ""}`, v: f1(p.pts) })) }));
  }

  // 23 playoffs
  const PO = H.flatMap(s => (s.bracket || []).map(b => ({ s, ...b }))).filter(b => b.p === 0 || b.p === 1);
  if (PO.length) {
    const pr2 = {}; PO.forEach(b => [b.a, b.b].forEach(o => { const x = (pr2[o] ||= { o, w: 0, l: 0, fin: 0, ttl: 0, seasons: new Set() }); x.seasons.add(b.s.season);
      if (b.win === o) x.w++; else if (b.win) x.l++; if (b.p === 1) { x.fin++; if (b.win === o) x.ttl++; } }));
    const pt = Object.values(pr2).sort((a, b) => b.w - a.w || a.l - b.l);
    F.push(() => ({ kick: "Ewige Playoff-Tabelle", title: `${N(pt[0].o)} hat die meisten Playoff-Siege: ${pt[0].w}`,
      sub: `Nur Spiele im Meisterschafts-Baum (ohne Platzierungsspiele) seit ${H[0].season}.`, num: rec(pt[0].w, pt[0].l), unit: "Playoff-Bilanz", box: "Playoff-Bilanz",
      rows: pt.slice(0, 6).map(x => ({ who: N(x.o), small: `${x.seasons.size}× dabei · ${x.fin}× im Finale`, v: rec(x.w, x.l) })) }));
    const ps = PO.flatMap(b => [{ ...b, o: b.a, p0: b.pa, opp: b.b }, { ...b, o: b.b, p0: b.pb, opp: b.a }]).filter(x => x.p0 != null && x.p0 > 0).sort((a, b) => b.p0 - a.p0);
    if (ps.length) F.push(() => ({ kick: "Playoff-Rekord", title: `${N(ps[0].o)} legte in den Playoffs ${f1(ps[0].p0)} Punkte auf`,
      sub: `${whenS(ps[0].s, ps[0].w)}${ps[0].p === 1 ? " – im Finale" : ""} gegen ${N(ps[0].opp)}. Der höchste Score, der je in einem WFFL-Playoff-Spiel gefallen ist.`,
      num: f1(ps[0].p0), unit: "Punkte", box: "Die höchsten Playoff-Scores",
      rows: ps.slice(0, 5).map(x => ({ who: N(x.o), small: `${whenS(x.s, x.w)}${x.p === 1 ? " · Finale" : ""}`, v: f1(x.p0) })) }));
    // regular season rank vs. title
    const rank = s => { const t = {}; G.filter(g => g.s === s).forEach(g => [[g.a, g.pa, g.pb], [g.b, g.pb, g.pa]].forEach(([o, pf, pa]) => { const x = (t[o] ||= { o, w: 0, pf: 0 }); x.w += pf > pa ? 1 : pf === pa ? .5 : 0; x.pf += pf; }));
      return Object.values(t).sort((a, b) => b.w - a.w || b.pf - a.pf).map(x => x.o); };
    const rs = H.filter(s => s.champ).map(s => { const r = rank(s); return { s, first: r[0], champRank: r.indexOf(s.champ) + 1 }; }).filter(x => x.first);
    if (rs.length) {
      const hits = rs.filter(x => x.first === x.s.champ).length;
      F.push(() => ({ kick: "Fluch der Hauptrunde", title: `Nur ${hits} von ${rs.length} Hauptrundensiegern wurden auch Meister`,
        sub: "Hauptrundensieger: meiste Siege, bei Gleichstand mehr Punkte.", num: `${hits}/${rs.length}`, unit: "Titel als Erster", box: "Hauptrundensieger und Meister",
        rows: [...rs].reverse().slice(0, 7).map(x => ({ who: N(x.first), small: x.first === x.s.champ ? "auch Meister" : `Meister: ${N(x.s.champ)} (Platz ${x.champRank})`, v: x.s.season })) }));
      const cin = [...rs].sort((a, b) => b.champRank - a.champRank)[0];
      if (cin.champRank > 1) F.push(() => ({ kick: "Aschenputtel", title: `${N(cin.s.champ)} wurde ${cin.s.season} von Platz ${cin.champRank} aus Meister`,
        sub: "Der Champion mit der schwächsten Hauptrunde der Liga-Geschichte. In den Playoffs zählt eben nur der nächste Sonntag.", num: `#${cin.champRank}`, unit: "nach der Hauptrunde" }));
    }
  }

  // 11 rivalries
  const pr = {}; G.forEach(g => { const [a, b] = [g.a, g.b].sort(); const k = a + "|" + b; const p = (pr[k] ||= { a, b, wa: 0, wb: 0, t: 0, list: [] });
    const pa = g.a === a ? g.pa : g.pb, pb = g.a === a ? g.pb : g.pa; if (pa > pb) p.wa++; else if (pb > pa) p.wb++; else p.t++; p.list.push({ g, pa, pb }); });
  const P = Object.values(pr).map(p => ({ ...p, n: p.list.length, dom: p.wa >= p.wb ? p.a : p.b, sub: p.wa >= p.wb ? p.b : p.a, w: Math.max(p.wa, p.wb), l: Math.min(p.wa, p.wb) }));
  const lop = P.filter(p => p.n >= 3).sort((x, y) => (y.w / y.n) - (x.w / x.n) || y.n - x.n);
  if (lop.length && lop[0].w > lop[0].l) F.push(() => ({ kick: "Lieblingsgegner", title: `${N(lop[0].dom)} gegen ${N(lop[0].sub)}: ${rec(lop[0].w, lop[0].l, lop[0].t)}`,
    sub: lop[0].l === 0 ? `${N(lop[0].sub)} hat dieses Duell noch nie gewonnen.` : "Das einseitigste Duell der Liga-Geschichte (mindestens 3 Spiele).", num: rec(lop[0].w, lop[0].l, lop[0].t), unit: "Bilanz", box: "Die einseitigsten Duelle",
    rows: lop.slice(0, 5).map(p => ({ who: `${N(p.dom)} vs. ${N(p.sub)}`, small: `${p.n} Spiele`, v: rec(p.w, p.l, p.t) })) }));
  const most = [...P].sort((x, y) => y.n - x.n);
  if (most[0] && most[0].n >= 3) F.push(() => { const p = most[0]; return { kick: "Der Klassiker", title: `${N(p.a)} und ${N(p.b)} trafen schon ${p.n}-mal aufeinander`,
    sub: `Bilanz ${rec(p.wa, p.wb, p.t)} aus Sicht von ${N(p.a)}. Punkte gesamt: ${f1(p.list.reduce((s, x) => s + x.pa, 0))} zu ${f1(p.list.reduce((s, x) => s + x.pb, 0))}.`,
    num: p.n, unit: "Duelle", box: "Die letzten Begegnungen",
    rows: p.list.slice(-5).reverse().map(x => ({ who: x.pa > x.pb ? N(p.a) : x.pb > x.pa ? N(p.b) : "Unentschieden", small: when(x.g), v: `${f1(x.pa)} : ${f1(x.pb)}` })) }; });

  // 12 consistency
  const sd = a => { const m = a.reduce((s, x) => s + x, 0) / a.length; return Math.sqrt(a.reduce((s, x) => s + (x - m) ** 2, 0) / a.length); };
  const con = owners.map(o => { const a = res[o].map(x => x.pf); return { o, sd: sd(a), avg: a.reduce((s, x) => s + x, 0) / a.length, n: a.length }; }).filter(x => x.n >= 8).sort((a, b) => a.sd - b.sd);
  if (con.length > 2) {
    F.push(() => ({ kick: "Das Uhrwerk", title: `${N(con[0].o)} ist der konstanteste Manager der Liga`, sub: `Im Schnitt ${f1(con[0].avg)} Punkte pro Woche, mit der geringsten Schwankung aller Teams (Standardabweichung).`,
      num: "±" + con[0].sd.toFixed(1), unit: "Punkte Schwankung", box: "Konstanz-Ranking", rows: con.slice(0, 6).map(x => ({ who: N(x.o), small: `Ø ${f1(x.avg)}`, v: "±" + x.sd.toFixed(1) })) }));
    const v = [...con].reverse();
    F.push(() => ({ kick: "Die Wundertüte", title: `Bei ${N(v[0].o)} weiß man nie, was kommt`, sub: `Im Schnitt ${f1(v[0].avg)} Punkte, aber mit der größten Schwankung der Liga: Mal Rekordwoche, mal Totalausfall.`,
      num: "±" + v[0].sd.toFixed(1), unit: "Punkte Schwankung", box: "Die größten Schwankungen", rows: v.slice(0, 6).map(x => ({ who: N(x.o), small: `Ø ${f1(x.avg)}`, v: "±" + x.sd.toFixed(1) })) }));
  }

  // 13 bench record
  const bn = [...SC].sort((a, b) => b.bench - a.bench);
  if (bn[0] && bn[0].bench > 0) F.push(() => ({ kick: "Bank-Rekord · Allzeit", title: `${N(bn[0].o)} ließ ${f1(bn[0].bench)} Punkte auf der Bank liegen`,
    sub: `${when(bn[0])}. Die Starter holten in dieser Woche ${f1(bn[0].p)} Punkte.`, num: f1(bn[0].bench), unit: "Bankpunkte", box: "Die teuersten Bänke",
    rows: bn.slice(0, 5).map(x => ({ who: N(x.o), small: when(x), v: f1(x.bench) })) }));

  // 14 best single player performance (only players with known names)
  const tp = SC.filter(x => x.top && PLAYERS[x.top[0]]).sort((a, b) => b.top[1] - a.top[1]);
  if (tp.length) F.push(() => { const m = PLAYERS[tp[0].top[0]]; return { kick: "Bester Einzelauftritt", title: `${m[0]} (${m[1]}) lieferte ${f1(tp[0].top[1])} Punkte für ${N(tp[0].o)}`,
    sub: `${when(tp[0])}. Der beste Einzelwert eines Starters, den die Liga je gesehen hat.`, num: f1(tp[0].top[1]), unit: "Punkte", box: "Top-Einzelleistungen",
    rows: tp.slice(0, 5).map(x => { const q = PLAYERS[x.top[0]]; return { who: `${q[0]} · ${q[1]}`, small: `${N(x.o)} · ${when(x)}`, v: f1(x.top[1]) }; }) }; });

  // 15 highest scoring week of the league
  const wsum = Object.entries(byWeek).map(([k, a]) => { const [si, w] = k.split("-").map(Number); return { si, w, s: H[si], avg: a.reduce((s, x) => s + x, 0) / a.length }; }).sort((a, b) => b.avg - a.avg);
  if (wsum.length > 3) F.push(() => ({ kick: "Torfestival", title: `${when(wsum[0])} war die punktreichste Woche der Liga-Geschichte`,
    sub: `Im Schnitt ${f1(wsum[0].avg)} Punkte pro Team. Die punktärmste Woche (${when(wsum[wsum.length - 1])}) kam auf nur ${f1(wsum[wsum.length - 1].avg)}.`,
    num: f1(wsum[0].avg), unit: "Ø Punkte pro Team", box: "Die punktreichsten Wochen", rows: wsum.slice(0, 5).map(x => ({ who: when(x), small: "", v: f1(x.avg) })) }));

  // 16 seasons compared
  if (H.length > 1) { const sa = H.map(s => ({ s, avg: s.scores.length ? s.scores.reduce((a, x) => a + x[2], 0) / s.scores.length : 0 })).filter(x => x.avg);
    const top = [...sa].sort((a, b) => b.avg - a.avg)[0];
    if (sa.length > 1) F.push(() => ({ kick: "Saisonvergleich", title: `${top.s.season} war die offensivste WFFL-Saison`, sub: "Durchschnittliche Punkte pro Team und Woche in der Hauptrunde.",
      num: f1(top.avg), unit: "Ø Punkte", box: "Alle Saisons", rows: [...sa].reverse().map(x => ({ who: x.s.season, small: x.s.id === LEAGUE ? "laufende Saison" : "", v: f1(x.avg) })) })); }

  // 17 all-time table
  const tab = owners.map(o => ({ o, ...wl(o), pf: res[o].reduce((s, x) => s + x.pf, 0) })).map(x => ({ ...x, pc: pct(x.w, x.t, x.g) })).sort((a, b) => b.pc - a.pc || b.pf - a.pf);
  if (tab.length > 2) F.push(() => ({ kick: "Ewige Tabelle", title: `${N(tab[0].o)} führt die ewige WFFL-Tabelle an`, sub: `${rec(tab[0].w, tab[0].l, tab[0].t)} in ${tab[0].g} Hauptrundenspielen · ${span}.`,
    num: tab[0].pc + "%", unit: "Siegquote", box: "Ewige Tabelle", rows: tab.slice(0, 6).map(x => ({ who: N(x.o), small: `${rec(x.w, x.l, x.t)} · ${f1(x.pf)} Pkt.`, v: x.pc + "%" })) }));

  // 24 rivalry week (week 13)
  const curTeam = {}; H.forEach(s => Object.entries(s.names).forEach(([o, v]) => { if (v.team) curTeam[o] = v.team; }));
  const TN = o => curTeam[o] || N(o);
  const RG = G.filter(g => g.w === RIV_WEEK);
  const rp = {}; RG.forEach(g => { const [a, b] = [g.a, g.b].sort(); const x = (rp[a + "|" + b] ||= { a, b, wa: 0, wb: 0, t: 0, list: [] });
    const pa = g.a === a ? g.pa : g.pb, pb = g.a === a ? g.pb : g.pa; if (pa > pb) x.wa++; else if (pb > pa) x.wb++; else x.t++; x.list.push({ g, pa, pb }); });
  const RP = Object.values(rp).map(x => ({ ...x, n: x.list.length, last: x.list[x.list.length - 1].g.s.season })).sort((x, y) => y.n - x.n || Math.abs(y.wa - y.wb) - Math.abs(x.wa - x.wb));
  if (RP.length) {
    const dom = [...RP].filter(x => x.n >= 2).sort((x, y) => Math.abs(y.wa - y.wb) / y.n - Math.abs(x.wa - x.wb) / x.n)[0];
    F.push(() => ({ kick: `Rivalry Week · Woche ${RIV_WEEK}`, rival: true,
      title: dom && dom.wa !== dom.wb ? `${TN(dom.wa > dom.wb ? dom.a : dom.b)} beherrscht die Rivalität gegen ${TN(dom.wa > dom.wb ? dom.b : dom.a)}` : "So stehen die Rivalitäten der WFFL",
      sub: `Woche ${RIV_WEEK} ist jedes Jahr Rivalry Week. Ausgewertet: alle Rivalry-Week-Duelle seit ${H[0].season}.`, box: "Bilanz in der Rivalry Week",
      rows: RP.slice(0, 7).map(x => ({ who: `${TN(x.a)} vs. ${TN(x.b)}`, small: `${x.n}× · zuletzt ${x.last}`, v: rec(x.wa, x.wb, x.t) })) }));
  }
  // ===== 26+ new facts (balanced: computed for every manager alike) =====
  const scAt = {}; SC.forEach(x => scAt[`${x.si}-${x.w}-${x.o}`] = x);
  const perOwner = (fn, min) => owners.map(o => ({ o, ...fn(o) })).filter(x => !min || x.n >= min);

  // 26 lineup efficiency vs. the best possible lineup in hindsight
  const eff = perOwner(o => { const a = SC.filter(x => x.o === o && x.opt > 0); const p = a.reduce((s, x) => s + x.p, 0), m = a.reduce((s, x) => s + x.opt, 0);
    return { e: m ? p / m * 100 : 0, lost: (m - p) / (a.length || 1), n: a.length }; }, 8).sort((a, b) => b.e - a.e);
  if (eff.length > 2) {
    F.push(() => ({ kick: "Trainer des Jahres · Allzeit", title: `${N(eff[0].o)} holt aus dem eigenen Kader das meiste heraus`,
      sub: `${eff[0].e.toFixed(1)} % der möglichen Punkte. Verglichen wird jede Woche mit der bestmöglichen Aufstellung aus dem ganzen Kader (im Nachhinein) · ${span}.`,
      num: eff[0].e.toFixed(1) + "%", unit: "Aufstellungs-Quote", box: "Aufstellungs-Quote",
      rows: eff.slice(0, 6).map(x => ({ who: N(x.o), small: `${f1(x.lost)} Pkt. pro Woche liegen gelassen`, v: x.e.toFixed(1) + "%" })) }));
    const z = [...eff].reverse();
    F.push(() => ({ kick: "Aufstellungs-Flop · Allzeit", title: `Niemand lässt so viele Punkte auf der Bank wie ${N(z[0].o)}`,
      sub: `Im Schnitt ${f1(z[0].lost)} Punkte pro Woche, die mit der optimalen Aufstellung drin gewesen wären.`,
      num: f1(z[0].lost), unit: "Punkte pro Woche verschenkt", box: "Verschenkte Punkte pro Woche",
      rows: z.slice(0, 6).map(x => ({ who: N(x.o), small: `Quote ${x.e.toFixed(1)} %`, v: f1(x.lost) })) }));
  }

  // 27 beaten by their own bench: losses the optimal lineup would have won
  const selfL = all.filter(x => !x.won && !x.tie).map(x => { const s = scAt[`${x.si}-${x.w}-${x.o}`]; return s && s.opt > x.pa ? { ...x, opt: s.opt } : null; }).filter(Boolean);
  if (selfL.length) {
    const cnt2 = perOwner(o => ({ n: selfL.filter(x => x.o === o).length, g: res[o].length })).sort((a, b) => b.n - a.n);
    const worst = [...selfL].sort((a, b) => (b.opt - b.pa) - (a.opt - a.pa))[0];
    F.push(() => ({ kick: "Selbst geschlagen", title: `${N(cnt2[0].o)} hat ${cnt2[0].n}-mal verloren, obwohl der Sieg auf der eigenen Bank saß`,
      sub: `Krassester Fall: ${when(worst)} – ${f1(worst.pf)} zu ${f1(worst.pa)} gegen ${N(worst.opp)} verloren, mit der besten Aufstellung wären es ${f1(worst.opt)} gewesen.`,
      num: cnt2[0].n, unit: "vermeidbare Niederlagen", box: `Vermeidbare Niederlagen · ligaweit ${selfL.length}`,
      rows: cnt2.filter(x => x.n).slice(0, 6).map(x => ({ who: N(x.o), small: `in ${x.g} Spielen`, v: x.n })) }));
  }

  // 28 ghost starters: 0 points or empty slot
  const gh = perOwner(o => ({ n: SC.filter(x => x.o === o).reduce((s, x) => s + x.zeros.length, 0) })).sort((a, b) => b.n - a.n);
  const ghW = [...SC].sort((a, b) => b.zeros.length - a.zeros.length)[0];
  if (gh[0] && gh[0].n) F.push(() => ({ kick: "Geisterspieler", title: `${N(gh[0].o)} hat ${gh[0].n}-mal einen Starter mit 0 Punkten aufgestellt`,
    sub: `Gezählt: Starter ohne einen einzigen Punkt (Bye, verletzt, inaktiv) und leere Kaderplätze · ${span}.${ghW.zeros.length > 1 ? ` Rekord in einer Woche: ${ghW.zeros.length} bei ${N(ghW.o)} (${when(ghW)}).` : ""}`,
    num: gh[0].n, unit: "Null-Punkte-Starter", box: "Die meisten Geisterspieler", rows: gh.slice(0, 6).map(x => ({ who: N(x.o), small: "", v: x.n })) }));

  // 29 schedule swap: everyone's season record with someone else's schedule
  const swaps = [], harsh = [];
  H.forEach((s, si) => {
    const opp = {}, sc = {}, gs = G.filter(g => g.si === si);
    gs.forEach(g => { (opp[g.w] ||= {})[g.a] = g.b; opp[g.w][g.b] = g.a; (sc[g.w] ||= {})[g.a] = g.pa; sc[g.w][g.b] = g.pb; });
    const ws = Object.keys(opp); if (ws.length < 4) return;
    const os = [...new Set(gs.flatMap(g => [g.a, g.b]))];
    const recOf = (x, y) => { let w = 0, l = 0, t = 0; ws.forEach(k => { let z = opp[k][y]; if (z === undefined || sc[k][x] === undefined) return; if (z === x) z = y;
      const a = sc[k][x], b = sc[k][z]; if (a > b) w++; else if (a < b) l++; else t++; }); return { w, l, t }; };
    os.forEach(x => { const own = recOf(x, x); let better = 0;
      os.forEach(y => { if (y === x) return; const r = recOf(x, y); const d = (r.w + r.t / 2) - (own.w + own.t / 2); if (d > 0) better++; swaps.push({ s, x, y, own, r, d }); });
      harsh.push({ s, o: x, own, better, n: os.length - 1 }); });
  });
  const rr = r => rec(r.w, r.l, r.t);
  if (swaps.length) {
    const sw2 = [...swaps].sort((a, b) => b.d - a.d);
    if (sw2[0].d > 0) F.push(() => ({ kick: "Falscher Spielplan", title: `Mit dem Spielplan von ${N(sw2[0].y)} wäre ${N(sw2[0].x)} ${sw2[0].s.season} ${rr(sw2[0].r)} statt ${rr(sw2[0].own)} gewesen`,
      sub: "Gleiche Punkte, andere Gegner: Jedes Team spielt mit dem Spielplan eines anderen Teams. Ein Gradmesser dafür, wie viel der Spielplan ausmacht.",
      num: "+" + sw2[0].d, unit: "Siege nur durch den Spielplan", box: "Die größten Spielplan-Unterschiede",
      rows: sw2.slice(0, 5).map(x => ({ who: `${N(x.x)} mit Plan von ${N(x.y)}`, small: `${x.s.season} · echt ${rr(x.own)}`, v: rr(x.r) })) }));
    const hh = harsh.filter(x => x.n >= 3).sort((a, b) => b.better / b.n - a.better / a.n)[0];
    if (hh && hh.better > hh.n / 2) F.push(() => ({ kick: "Der härteste Spielplan", title: `${hh.s.season} hätten ${N(hh.o)} ${hh.better} von ${hh.n} fremden Spielplänen mehr Siege gebracht`,
      sub: `Echte Bilanz ${rr(hh.own)}. Mit fast jedem anderen Spielplan wäre die Saison besser gelaufen.`, num: `${hh.better}/${hh.n}`, unit: "Spielpläne wären besser gewesen" }));
  }

  // 30 toughest opponents: points against
  const pa = perOwner(o => ({ avg: res[o].reduce((s, x) => s + x.pa, 0) / res[o].length, n: res[o].length }), 8).sort((a, b) => b.avg - a.avg);
  if (pa.length > 2) F.push(() => ({ kick: "Immer gegen die Besten", title: `Gegen ${N(pa[0].o)} spielt die Liga ihre besten Wochen`,
    sub: `Im Schnitt ${f1(pa[0].avg)} Gegenpunkte pro Spiel – so viel musste kein anderer Manager schlagen. Am entspanntesten hatte es ${N(pa[pa.length - 1].o)} mit ${f1(pa[pa.length - 1].avg)}.`,
    num: f1(pa[0].avg), unit: "Ø Gegenpunkte", box: "Ø Gegenpunkte pro Spiel", rows: pa.slice(0, 6).map(x => ({ who: N(x.o), small: `${x.n} Spiele`, v: f1(x.avg) })) }));

  // 31 season-best gifts: opponent's best score of the season came against you
  const sbest = {}; SC.forEach(x => { const k = x.si + "|" + x.o; if (!(k in sbest) || x.p > sbest[k]) sbest[k] = x.p; });
  const gift = all.filter(x => x.pa > 0 && x.pa === sbest[x.si + "|" + x.opp]);
  const gc = perOwner(o => ({ n: gift.filter(x => x.o === o).length })).sort((a, b) => b.n - a.n);
  if (gc[0] && gc[0].n >= 2) F.push(() => ({ kick: "Karrieretag-Spender", title: `${gc[0].n}-mal hat ein Gegner ausgerechnet gegen ${N(gc[0].o)} seinen Saisonbestwert aufgelegt`,
    sub: `Gezählt: Spiele, in denen der Gegner seinen höchsten Hauptrunden-Score der Saison erzielte · ${span}.`,
    num: gc[0].n, unit: "Saisonbestwerte kassiert", box: "Die großzügigsten Gegner", rows: gc.filter(x => x.n).slice(0, 6).map(x => ({ who: N(x.o), small: "", v: x.n })) }));

  // 32 table with an extra game against the weekly median (latest season with 4+ weeks)
  const mSi = [...H.keys()].reverse().find(si => new Set(G.filter(g => g.si === si).map(g => g.w)).size >= 4);
  if (mSi != null) {
    const t = {}; all.filter(x => x.si === mSi).forEach(x => { const r = (t[x.o] ||= { o: x.o, w: 0, l: 0, t: 0, mw: 0, ml: 0, pf: 0 }); r.pf += x.pf;
      if (x.won) r.w++; else if (x.tie) r.t++; else r.l++; const md = median(wk(x)); if (x.pf > md) r.mw++; else if (x.pf < md) r.ml++; });
    const T = Object.values(t).map(r => ({ ...r, tw: r.w + r.mw, tl: r.l + r.ml })).sort((a, b) => b.tw - a.tw || a.tl - b.tl || b.pf - a.pf);
    const real = Object.values(t).sort((a, b) => (b.w + b.t / 2) - (a.w + a.t / 2) || b.pf - a.pf).map(r => r.o);
    const mover = T.map((r, i) => ({ r, d: real.indexOf(r.o) - i })).sort((a, b) => Math.abs(b.d) - Math.abs(a.d))[0];
    F.push(() => ({ kick: `Gerechte Tabelle · ${H[mSi].season}`, title: `Mit einem Extra-Spiel gegen den Liga-Median stünde ${N(T[0].o)} ganz oben`,
      sub: `Jede Woche zählt doppelt: das echte Duell plus ein Spiel gegen den Median aller Scores.${mover && mover.d ? ` Größter Sprung: ${N(mover.r.o)} (${mover.d > 0 ? "+" : "−"}${Math.abs(mover.d)} ${Math.abs(mover.d) === 1 ? "Platz" : "Plätze"}).` : ""}`,
      box: "Tabelle inkl. Median-Spiele", rows: T.slice(0, 8).map(r => ({ who: N(r.o), small: `echt ${rec(r.w, r.l, r.t)} · Median ${r.mw}-${r.ml}`, v: `${r.tw}-${r.tl}` })) }));
  }

  // 33 the kicker decided it: winning margin smaller than the winner's kicker points
  const kg = G.filter(g => g.d > 0).map(g => { const [w, , l] = WL(g); const x = scAt[`${g.si}-${g.w}-${w}`]; return x && x.kick > g.d ? { g, w, l, k: x.kick } : null; }).filter(Boolean);
  if (kg.length) {
    const best = [...kg].sort((a, b) => a.g.d - b.g.d)[0];
    const kc = perOwner(o => ({ n: kg.filter(x => x.w === o).length })).filter(x => x.n).sort((a, b) => b.n - a.n);
    F.push(() => ({ kick: "Der Kicker hat's entschieden", title: `${kg.length}-mal war der Vorsprung kleiner als die Punkte des eigenen Kickers`,
      sub: `Ohne Kicker wären diese Duelle verloren gegangen. Knappster Fall: ${N(best.w)} gegen ${N(best.l)}, ${when(best.g)} – ${f1(best.g.d)} Punkte Vorsprung, Kicker ${f1(best.k)}.`,
      num: kg.length, unit: "Kicker-Siege", box: "Die meisten Kicker-Siege", rows: kc.slice(0, 6).map(x => ({ who: N(x.o), small: "", v: x.n })) }));
  }

  // 34 defense disaster
  const dd = SC.filter(x => x.def && x.def[0] < 0).sort((a, b) => a.def[0] - b.def[0]);
  if (dd.length) F.push(() => { const x = dd[0]; const g = all.find(r => r.si === x.si && r.w === x.w && r.o === x.o);
    return { kick: "Defense-Desaster", title: `Die ${pName(x.def[1])}-Defense bescherte ${N(x.o)} ${f1(x.def[0])} Punkte`,
      sub: `${when(x)}.${g ? (g.won ? " Gewonnen wurde trotzdem." : ` Das Duell gegen ${N(g.opp)} ging ${f1(g.pf)} zu ${f1(g.pa)} verloren${g.pa - g.pf < -x.def[0] ? " – mit einer Null-Punkte-Defense wäre es ein Sieg gewesen" : ""}.`) : ""}`,
      num: f1(x.def[0]), unit: "Punkte", box: "Die schlechtesten Defense-Auftritte",
      rows: dd.slice(0, 5).map(y => ({ who: `${pName(y.def[1])} DEF`, small: `${N(y.o)} · ${when(y)}`, v: f1(y.def[0]) })) }; });

  // 35 drop regret
  const RGT = H.flatMap(s => (s.regrets || []).map(r => ({ s, ...r }))).sort((a, b) => b.pts - a.pts);
  if (RGT.length && RGT[0].pts >= 20) F.push(() => { const r = RGT[0];
    return { kick: "Wegwerf-Reue", title: `${N(r.o)} hat ${pName(r.pid)} entlassen – ${N(r.to)} griff zu und kassierte ${f1(r.pts)} Punkte`,
      sub: `Entlassen in ${whenS(r.s, r.w)}, von ${N(r.to)} geholt in Woche ${r.w2}. Gezählt: Starter-Punkte beim neuen Team bis Ende der Hauptrunde.`,
      num: f1(r.pts), unit: "Punkte für die Konkurrenz", box: "Die teuersten Entlassungen",
      rows: RGT.slice(0, 5).map(x => ({ who: `${pName(x.pid)}${pPos(x.pid) ? " · " + pPos(x.pid) : ""}`, small: `${N(x.o)} → ${N(x.to)} · ${x.s.season}`, v: f1(x.pts) })) }; });

  // 36 club legend: most starts for the same manager
  const lgd = {}; H.forEach(s => Object.entries(s.starts || {}).forEach(([o, m]) => Object.entries(m).forEach(([pid, n]) => {
    const x = (lgd[o + "|" + pid] ||= { o, pid, n: 0, seasons: new Set() }); x.n += n; x.seasons.add(s.season); })));
  const LGD = Object.values(lgd).sort((a, b) => b.n - a.n);
  const ssz = n => `${n} ${n === 1 ? "Saison" : "Saisons"}`;
  if (LGD.length && LGD[0].n >= 10) F.push(() => ({ kick: "Vereinslegende", title: `${pName(LGD[0].pid)} stand ${LGD[0].n}-mal in der Startaufstellung von ${N(LGD[0].o)}`,
    sub: `Hauptrundenwochen seit ${H[0].season}, verteilt auf ${ssz(LGD[0].seasons.size)}. Kein Spieler war einem Manager treuer.`,
    num: LGD[0].n, unit: "Starts für denselben Manager", box: "Die treuesten Spieler",
    rows: LGD.slice(0, 6).map(x => ({ who: `${pName(x.pid)}${pPos(x.pid) ? " · " + pPos(x.pid) : ""}`, small: `${N(x.o)} · ${ssz(x.seasons.size)}`, v: x.n })) }));

  // 37 champion of hearts: playoff appearances without a title
  if (PO.length) {
    const pa2 = {}; PO.forEach(b => [b.a, b.b].forEach(o => { const x = (pa2[o] ||= { o, seasons: new Set(), fin: 0 }); x.seasons.add(b.s.season); if (b.p === 1 && b.win && b.win !== o) x.fin++; }));
    const MH = Object.values(pa2).filter(x => !ch.some(c => c.o === x.o)).sort((a, b) => b.seasons.size - a.seasons.size || b.fin - a.fin);
    if (MH.length && MH[0].seasons.size >= 2) F.push(() => ({ kick: "Meister der Herzen", title: `${N(MH[0].o)}: ${MH[0].seasons.size}-mal in den Playoffs, noch ohne Titel`,
      sub: `${MH[0].fin ? `Darunter ${MH[0].fin} ${MH[0].fin === 1 ? "verlorenes Finale" : "verlorene Finals"}. ` : ""}Playoff-Teilnahmen seit ${H[0].season}, Titel inklusive der Zeit vor Sleeper.`,
      num: MH[0].seasons.size, unit: "Playoffs ohne Titel", box: "Playoffs ohne Titel", rows: MH.slice(0, 6).map(x => ({ who: N(x.o), small: x.fin ? `${x.fin}× Finale verloren` : "", v: `${x.seasons.size}×` })) }));
  }

  // 38 the wooden spoon: last place after the regular season
  const rankS = s => { const t = {}; G.filter(g => g.s === s).forEach(g => [[g.a, g.pa, g.pb], [g.b, g.pb, g.pa]].forEach(([o, pf, pg]) => {
      const x = (t[o] ||= { o, w: 0, l: 0, tt: 0, pf: 0 }); if (pf > pg) x.w++; else if (pf < pg) x.l++; else x.tt++; x.pf += pf; }));
    return Object.values(t).sort((a, b) => (b.w + b.tt / 2) - (a.w + a.tt / 2) || b.pf - a.pf); };
  const spoon = H.filter(s => s.status === "complete").map(s => { const r = rankS(s); return r.length ? { s, x: r[r.length - 1] } : null; }).filter(Boolean);
  if (spoon.length) {
    const sp2 = {}; spoon.forEach(z => sp2[z.x.o] = (sp2[z.x.o] || 0) + 1); const topS = Object.entries(sp2).sort((a, b) => b[1] - a[1])[0];
    F.push(() => ({ kick: "Der Löffel · Letzter der Hauptrunde", title: topS[1] > 1 ? `${N(topS[0])} hat den Löffel schon ${topS[1]}-mal abgeholt` : spoon.length === 1 ? `${N(topS[0])} beendete die Hauptrunde ${spoon[0].s.season} als Letzter` : `${spoon.length} Saisons, ${spoon.length} verschiedene Tabellenletzte`,
      sub: `Tabellenletzter nach der Hauptrunde (Siege, dann Punkte) · seit ${H[0].season}.`, num: topS[1], unit: topS[1] > 1 ? "Löffel" : "Löffel pro Manager", box: "Alle Tabellenletzten",
      rows: [...spoon].reverse().slice(0, 8).map(z => ({ who: N(z.x.o), small: `${rec(z.x.w, z.x.l, z.x.tt)} · ${f1(z.x.pf)} Pkt.`, v: z.s.season })) }));
  }

  // 18 live: record chase this week
  F.push(() => { const live = [...S.matchups].filter(m => m.points > 0).sort((a, b) => b.points - a.points)[0]; if (!live) return null;
    const rank = hi.filter(x => x.p > live.points).length + 1; const t = team(live.roster_id);
    const seasonBest = hi.find(x => x.si === cur);
    if (rank <= 10) return { kick: "Live · Rekordjagd", title: `${t.name} steht gerade auf Platz ${rank} der Allzeit-Bestenliste`, sub: `${f1(live.points)} Punkte in Woche ${S.week}${counts(live).pre || counts(live).live ? " – und es wird noch gespielt" : ""}. Allzeit-Rekord: ${f1(hi[0].p)} (${N(hi[0].o)}).`, num: f1(live.points), unit: "Punkte live" };
    if (seasonBest && live.points > seasonBest.p) return { kick: "Live · Saisonbestwert", title: `${t.name} knackt gerade den Saisonbestwert`, sub: `Bisheriger Bestwert ${H[cur].season}: ${f1(seasonBest.p)} (${N(seasonBest.o)}, Woche ${seasonBest.w}).`, num: f1(live.points), unit: "Punkte live" };
    return null; });

  // 19 live: history of this week's matchups (one fact per pairing)
  pairs().forEach((_, i) => F.push(() => { const pp = pairs()[i]; if (!pp) return null;
    const oa = (rosterById(pp[0].roster_id) || {}).owner_id, ob = (rosterById(pp[1].roster_id) || {}).owner_id; if (!oa || !ob) return null;
    const [a, b] = [oa, ob].sort(); const p = pr[a + "|" + b]; const ta = team(pp[0].roster_id), tb = team(pp[1].roster_id);
    if (!p) return { kick: S.week === RIV_WEEK ? "Rivalry Week · Vorgeschichte" : "Duell der Woche · Vorgeschichte", rival: S.week === RIV_WEEK, title: `${ta.name} gegen ${tb.name}: das allererste Aufeinandertreffen`, sub: `${N(oa)} und ${N(ob)} haben in der Hauptrunde noch nie gegeneinander gespielt.`, num: "0", unit: "bisherige Duelle" };
    const wa = oa === a ? p.wa : p.wb, wb = oa === a ? p.wb : p.wa;
    return { kick: S.week === RIV_WEEK ? "Rivalry Week · Vorgeschichte" : "Duell der Woche · Vorgeschichte", rival: S.week === RIV_WEEK, title: `${N(oa)} gegen ${N(ob)}: ${rec(wa, wb, p.t)} in ${p.list.length} Duellen`,
      sub: wa === wb ? "Komplett ausgeglichen – diese Woche bringt die Entscheidung." : `${N(wa > wb ? oa : ob)} hat die Nase vorn. Aktuell: ${f1(pp[0].points)} zu ${f1(pp[1].points)}.`,
      num: rec(wa, wb, p.t), unit: "Bilanz", box: "Die letzten Begegnungen",
      rows: p.list.slice(-5).reverse().map(x => ({ who: x.pa > x.pb ? N(p.a) : x.pb > x.pa ? N(p.b) : "Unentschieden", small: when(x.g), v: `${f1(Math.max(x.pa, x.pb))} : ${f1(Math.min(x.pa, x.pb))}` })) }; }));

  // shuffle so each round shows something different
  for (let i = F.length - 1; i > 0; i--) { const k = Math.floor(Math.random() * (i + 1)); [F[i], F[k]] = [F[k], F[i]]; }
  // all-time head-to-head for the duel view (regular season + playoffs)
  const po = {}; PO.forEach(b => { if (!b.win) return; const [x, y] = [b.a, b.b].sort(); const r = (po[x + "|" + y] ||= { a: x, wa: 0, wb: 0 }); if (b.win === x) r.wa++; else r.wb++; });
  S.h2h = pr; S.h2hPO = po;
  S.facts = F; S.factPick = 0;
}

const weekLabel = () => S.week === RIV_WEEK ? `Woche ${S.week} · Rivalry Week` : `Woche ${S.week}`;
function vRivalFact(){
  const R = S.facts.filter(f => { try { const x = f(); return x && x.rival; } catch(e){ return false; } });
  if (!R.length) return vFact();
  const f = R[(S.rivPick || 0) % R.length]();
  return renderFact(f, "Rivalry Week");
}
function vFact(){
  const L = S.facts.length; let f = null;
  for (let k = 0; k < L && !f; k++) { const i = (S.factPick + k) % L; try { f = S.facts[i](); } catch(e){ f = null; } if (f) S.factShown = i; }
  if (!f) return { title: "WFFL-Historie", dur: 4000, html: `<div class="empty">Historie wird ausgewertet …</div>` };
  return renderFact(f);
}
function renderFact(f, head){
  const rows = (f.rows || []).map((r, i) => `<div class="rank"><div class="n">${i + 1}</div><div class="who"><b>${esc(r.who)}</b>${r.small ? `<i>${esc(r.small)}</i>` : ""}</div><div class="v">${esc(r.v)}</div></div>`).join("");
  const hero = f.num != null ? `<div class="hero"><b>${esc(f.num)}</b><span>${esc(f.unit || "")}</span></div>` : "";
  return { title: head || "Fakt der Runde · WFFL seit 2017/18", dur: DUR.fact,
    html: `<div class="fact"><div class="ftxt"><div class="kick">${esc(f.kick)}</div><h2>${esc(f.title)}</h2>${f.sub ? `<div class="sub">${esc(f.sub)}</div>` : ""}${rows ? hero : ""}</div>
      ${rows ? `<div class="box"><h3>${esc(f.box || "")}</h3>${rows}</div>` : `<div class="ftxt">${hero}</div>`}</div>` };
}

/* ---------- big plays (ESPN game summaries) ---------- */
const ESPN_SUM = "https://site.api.espn.com/apis/site/v2/sports/football/nfl/summary";
const normName = s => String(s || "").replace(/\b(Jr|Sr|II|III|IV|V)\b\.?/g, "").toLowerCase().replace(/[^a-z]/g, "");
function rosterIndex(){
  const idx = {};
  S.matchups.forEach(m => { const st = new Set(m.starters || []);
    (m.players || []).forEach(pid => { const meta = PLAYERS[pid]; if (!meta || !meta[2]) return;
      (idx[meta[2]] ||= []).push({ pid, rid: m.roster_id, starter: st.has(pid), pos: meta[1], name: meta[1] === "DEF" ? `${meta[0]} DEF` : meta[0], key: meta[1] === "DEF" ? null : normName(meta[0]) }); }); });
  return idx;
}
function parseSummary(g, sum){
  const idx = rosterIndex(), teams = g.teams.map(t => t.abbr);
  const dr = (sum && sum.drives) || {};
  const drives = [...(dr.previous || []), ...(dr.current ? [dr.current] : [])];
  drives.forEach(d => {
    const off = ABBR_FIX[(d.team && d.team.abbreviation) || ""] || (d.team && d.team.abbreviation) || "";
    const def = teams.find(t => t !== off) || "";
    (d.plays || []).forEach(p => {
      const type = (p.type && p.type.text) || "", txt = p.text || "", yds = +p.statYardage || 0;
      if (/penalty|timeout|end of|two-minute/i.test(type) && !p.scoringPlay) return;
      const both = type + " " + txt;
      const defensive = /interception|fumble/i.test(type);
      const td = !!p.scoringPlay && /touchdown/i.test(both);
      const fg = /field goal good/i.test(type); const fgYds = fg ? +((txt.match(/(\d+)\s*(?:-?\s*yd|yard)/i) || [])[1] || 0) : 0;
      let kind = null, cls = "", dist = yds;
      if (td) { cls = "td"; kind = /interception/i.test(both) ? "Pick-Six" : /fumble/i.test(both) ? "Fumble-TD" : /kickoff|punt/i.test(both) ? "Return-TD" : /pass/i.test(type) ? "TD-Pass" : /rush|run/i.test(type) ? "TD-Lauf" : "Touchdown"; }
      else if (fg && fgYds >= 50) { kind = `${fgYds}-Yd-Field-Goal`; dist = 0; }
      else if (defensive && !/recovery \(own\)/i.test(type)) { kind = /interception/i.test(type) ? "Interception" : "Fumble"; dist = 0; }
      else if (yds >= 40 && /pass|rush|run/i.test(type)) kind = /pass/i.test(type) ? "Langer Pass" : "Langer Lauf";
      if (!kind) return;
      const n = normName(txt); const hits = [];
      if (defensive) (idx[def] || []).filter(x => x.pos === "DEF").forEach(x => hits.push(x));
      else (idx[off] || []).filter(x => x.key && x.key.length > 3 && n.includes(x.key)).forEach(x => hits.push(x));
      if (fg && !hits.length) (idx[off] || []).filter(x => x.pos === "K").forEach(x => hits.push(x));
      const m = txt.match(/[A-Z][a-z]?\.\s?[A-Z][A-Za-z'\-]+/);
      const primary = defensive ? `${def} Defense` : m ? m[0].replace(/\.(?=\S)/, ". ") : off;
      const per = (p.period && p.period.number) || 0, clk = (p.clock && p.clock.displayValue) || "";
      const wall = Date.parse(p.wallclock || "") || (g.date.getTime() + per * 3600e3 / 4 + (900 - (parseInt(clk) * 60 + (+clk.split(":")[1] || 0))) * 1000);
      S.bp.set(String(p.id || `${g.id}-${per}-${clk}-${txt.slice(0, 30)}`), { g, wall, kind, cls, dist, off: defensive ? def : off, per, clk, hits, primary });
    });
  });
}
async function loadBigPlays(){
  if (S.bpWeek !== S.week) { S.bp = new Map(); S.bpDone = new Set(); S.bpWeek = S.week; S.bpSeen = null; S.bpSig = ""; }
  const todo = S.gamesList.filter(g => g.id && (g.state === "in" || (g.state === "post" && !S.bpDone.has(g.id))));
  for (let i = 0; i < todo.length; i += 3) {
    await Promise.all(todo.slice(i, i + 3).map(async g => { try { const sum = await j(`${ESPN_SUM}?event=${g.id}`); parseSummary(g, sum); if (g.state === "post") S.bpDone.add(g.id); } catch(e){} }));
  }
  renderBP();
}
function renderBP(){
  const all = [...S.bp.values()], rel = all.filter(x => x.hits.length);
  const list = (rel.length ? rel : all).sort((a, b) => b.wall - a.wall).slice(0, 14);
  const sig = list.map(x => x.kind + x.wall + x.primary).join("|");
  if (sig === S.bpSig) return; S.bpSig = sig;
  const tape = $("bpTape");
  if (!list.length) { tape.classList.add("idle"); tape.innerHTML = `<span class="bpi"><span class="m">Noch keine Big Plays in Woche ${S.week} – sobald es kracht, steht es hier.</span></span>`; return; }
  tape.classList.remove("idle");
  const one = list.map(x => {
    const names = x.hits.length ? [...new Set(x.hits.map(h => h.name))].join(" & ") : x.primary;
    const per = x.per > 4 ? "OT" : `Q${x.per}`;
    const ff = [...new Map(x.hits.map(h => [h.rid, h])).values()].map(h => { const t = team(h.rid);
      return `<span class="ffw">${badge(t)}<span class="ff">${esc(t.name)}</span>${h.starter ? "" : `<span class="m">(Bank)</span>`}</span>`; }).join("");
    return `<span class="bpi"><span class="k ${x.cls}">${esc(x.kind)}</span><b>${esc(names)}</b><span class="m">${x.dist ? x.dist + " Yds · " : ""}${esc(x.off)} · ${per} ${esc(x.clk)}</span>${ff ? `<span class="arrow">→</span>${ff}` : ""}</span>`;
  }).join("");
  tape.innerHTML = one + one;
  tape.style.setProperty("--dur", `${Math.max(45, list.length * 10)}s`);
  const ids = new Set(all.filter(x => x.hits.length).map(x => x.kind + x.wall + x.primary));
  if (S.bpSeen && [...ids].some(k => !S.bpSeen.has(k))) { const l = $("bpLabel"); l.classList.remove("new"); void l.offsetWidth; l.classList.add("new"); }
  S.bpSeen = ids;
}

/* ---------- ticker ---------- */

function renderTape(){
  if (!S.gamesList.length){ $("tape").innerHTML = `<span class="g"><span class="d">Keine NFL-Spieldaten</span></span>`; return; }
  const one = S.gamesList.map(g => {
    const [a,h] = g.teams[0].home ? [g.teams[1], g.teams[0]] : [g.teams[0], g.teams[1]];
    const d = g.state==="pre" ? weekday.format(g.date).replace(",","") : g.state==="in" ? g.detail : "Final";
    const sc = g.state==="pre" ? "" : `<span class="${a.score>h.score?"w":""}">${a.score}</span> : <span class="${h.score>a.score?"w":""}">${h.score}</span>`;
    return `<span class="g ${esc(g.state)}">${g.state==="in"?'<span class="live-dot"></span>':""}<b>${esc(a.abbr)} @ ${esc(h.abbr)}</b>${sc}<span class="d">${esc(d)}</span>${g.rz?'<span class="rztag">RZ '+esc(g.poss||"")+'</span>':""}</span>`;
  }).join("");
  $("tape").innerHTML = one + one;
  $("tape").style.setProperty("--dur", `${Math.max(40, S.gamesList.length*7)}s`);
}

/* ---------- rotation ---------- */
let timer = null, started = 0, curDur = 0;
function show(i){
  S.views = buildViews();
  if (!S.views.length) return;
  S.idx = (i + S.views.length) % S.views.length;
  const fn = S.views[S.idx];
  if (fn === vFact) S.factPick = S.factShown + 1;
  if (fn === vRivalFact) S.rivPick++;
  const v = fn(); S.curKey = fn.key || fn.name; S.curHtml = v.html;
  const main = $("main"); const olds = [...main.querySelectorAll(".view")];
  olds.forEach(o => { if (!o.classList.contains("on")) o.remove(); });
  const el = document.createElement("div"); el.className = "view"; el.innerHTML = v.html; main.appendChild(el);
  requestAnimationFrame(() => { el.classList.add("on"); olds.forEach(o => { o.classList.remove("on"); setTimeout(() => o.remove(), 600); }); });
  $("viewTitle").textContent = v.title;
  curDur = v.dur; started = performance.now();
  clearTimeout(timer); if (!S.paused) timer = setTimeout(() => show(S.idx+1), curDur);
}
function rerenderCurrent(){
  const main = $("main"), cur = main.querySelector(".view.on"); if (!cur) return show(0);
  S.views = buildViews(); if (!S.views.length) return;
  // the view list can change (history loaded, Rivalry slot inserted): keep updating the view that is on screen
  const i = S.views.findIndex(f => (f.key || f.name) === S.curKey);
  if (i < 0) return;   // current view no longer exists: leave it, the rotation timer moves on
  S.idx = i;
  const v = S.views[i](); $("viewTitle").textContent = v.title;
  if (v.html === S.curHtml) return;   // nothing changed: no redraw, no flicker
  S.curHtml = v.html; cur.innerHTML = v.html;
}
function tickProgress(){
  const p = S.paused ? 1 : Math.min(1, (performance.now()-started)/(curDur||1));
  $("progress").style.width = `${p*100}%`;
  requestAnimationFrame(tickProgress);
}
requestAnimationFrame(tickProgress);

function togglePause(){
  S.paused = !S.paused; $("pauseTag").hidden = !S.paused;
  if (S.paused) clearTimeout(timer); else show(S.idx+1);
}
addEventListener("keydown", e => {
  if (e.key==="ArrowRight") show(S.idx+1);
  else if (e.key==="ArrowLeft") show(S.idx-1);
  else if (e.key===" " || e.key==="Enter" || e.key==="MediaPlayPause") { e.preventDefault(); togglePause(); }
  flashHint();
});
addEventListener("click", e => {
  const x = e.clientX / innerWidth;
  if (x < .3) show(S.idx-1); else if (x > .7) show(S.idx+1); else togglePause();
  flashHint(); keepAwake();
});
let hintT; function flashHint(){ $("hint").classList.add("on"); clearTimeout(hintT); hintT = setTimeout(() => $("hint").classList.remove("on"), 3000); }

/* ---------- clock / status / wake ---------- */
const hm = new Intl.DateTimeFormat("de-DE", { hour:"2-digit", minute:"2-digit" });
setInterval(() => {
  $("clock").textContent = hm.format(new Date());
  if (!S.lastOk) return;
  const age = Math.round((Date.now()-S.lastOk)/1000), st = $("status");
  st.textContent = age > 180 ? `offline · Stand ${hm.format(new Date(S.lastOk))}` : age < 10 ? "live" : `vor ${age} s aktualisiert`;
  st.classList.toggle("stale", age > 180);
}, 1000);
let lock = null;
async function keepAwake(){ try { if ("wakeLock" in navigator && !lock) { lock = await navigator.wakeLock.request("screen"); lock.addEventListener("release", () => lock = null); } } catch(e){} }
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") keepAwake(); });
keepAwake();

/* ---------- boot ---------- */
async function boot(){
  try {
    await loadStatic();
    $("lgName").textContent = S.league.name || "Liga"; $("weekLbl").textContent = weekLabel();
    await Promise.all([loadScores(), loadGames()]);
    renderTape(); show(0); flashHint();
    loadBigPlays();
    loadHistory();
  } catch(e){
    $("viewTitle").textContent = "Keine Verbindung";
    $("main").innerHTML = `<div class="view on"><div class="empty">Sleeper ist gerade nicht erreichbar.<br>Neuer Versuch in 30 Sekunden.</div></div>`;
    setTimeout(boot, 30000); return;
  }
  setInterval(async () => { try { await loadScores(); rerenderCurrent(); } catch(e){} }, 60000);
  setInterval(async () => { await loadGames(); renderTape(); rerenderCurrent(); }, 30000);
  setInterval(() => { loadBigPlays(); }, 60000);
  setInterval(async () => { try { const w = S.week; await loadStatic(); if (S.week !== w) { $("weekLbl").textContent = weekLabel(); await loadScores(); loadHistory(); } } catch(e){} }, 15*60000);
}
boot();
})();
</script>
