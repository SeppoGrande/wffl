<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>WFFL Scoreboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Layout: fixed 1600x900 broadcast stage, scaled to fit any screen (TV 16:9, iPad 4:3 letterboxed). Single dark look on purpose: it is a TV wall. */
:root{
  --night:#0a1120;      /* page ground, stadium at night */
  --panel:#111a2c;      /* cards */
  --panel-2:#16223a;    /* raised rows */
  --line:#24324f;       /* hairlines */
  --fg:#eef2f8;
  --muted:#8b98b4;
  --amber:#ffb43b;      /* leader / scorebug accent */
  --win:#3ccf86;
  --loss:#ff6464;
  --rz:#e5322d;         /* red zone */
  --display:"Barlow Condensed","Arial Narrow","Roboto Condensed",sans-serif;
  --body:"Barlow","Helvetica Neue",Arial,sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--night);color:var(--fg);font-family:var(--body);overflow:hidden;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));
  -webkit-user-select:none;user-select:none;cursor:default}
#stage{position:absolute;left:50%;top:50%;width:1600px;height:900px;transform-origin:50% 50%;
  display:grid;grid-template-rows:84px 48px 1fr 64px;font-variant-numeric:tabular-nums;
  background:radial-gradient(120% 80% at 50% 0%, #13213d 0%, var(--night) 60%)}

/* header */
header{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:28px;padding:0 40px;border-bottom:1px solid var(--line);position:relative}
.brand{display:flex;align-items:baseline;gap:16px}
.brand b{font-family:var(--display);font-weight:800;font-size:46px;letter-spacing:.04em}
.brand span{font-family:var(--display);font-weight:600;font-size:26px;color:var(--amber);letter-spacing:.06em;text-transform:uppercase}
#viewTitle{font-family:var(--display);font-weight:600;font-size:30px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);text-wrap:balance}
.meta{display:flex;align-items:center;gap:22px;font-size:20px;color:var(--muted)}
#clock{font-family:var(--display);font-weight:700;font-size:36px;color:var(--fg)}
#status.stale{color:var(--loss)}
#progress{position:absolute;left:0;bottom:-1px;height:3px;background:var(--amber);width:0}
#pauseTag{font-family:var(--display);font-size:20px;letter-spacing:.1em;color:var(--night);background:var(--amber);padding:2px 10px;border-radius:3px}

main{position:relative;overflow:hidden;padding:22px 40px}
.view{position:absolute;inset:22px 40px;opacity:0;transition:opacity .5s ease}
.view.on{opacity:1}

/* overview */
.grid6{display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(2,1fr);gap:22px;height:100%}
.mcard{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:22px 26px;display:grid;grid-template-rows:1fr 1fr auto;gap:6px}
.trow{display:grid;grid-template-columns:44px 1fr auto;align-items:center;gap:14px;min-width:0}
.badge{position:relative;overflow:hidden;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:20px;color:#0a1120}
.badge img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:var(--panel)}
.tb{display:flex;align-items:center;gap:12px;min-width:0}
.tb span{min-width:0;overflow:hidden;text-overflow:ellipsis}
td.team .badge{width:34px;height:34px;font-size:15px;flex:none}
.tname{font-family:var(--display);font-weight:600;font-size:30px;line-height:1.05;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.tname small{display:block;font-family:var(--body);font-weight:500;font-size:16px;color:var(--muted);margin-top:2px}
.pts{font-family:var(--display);font-weight:700;font-size:52px;line-height:1}
.lead .pts{color:var(--amber)}
.mfoot{display:flex;justify-content:space-between;font-size:17px;color:var(--muted);border-top:1px solid var(--line);padding-top:10px}
.live-dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--rz);margin-right:6px;vertical-align:1px;animation:pulse 1.4s infinite}
@keyframes pulse{50%{opacity:.25}}

/* matchup detail */
.duel{display:grid;grid-template-rows:auto 1fr;height:100%;gap:18px}
.duel-head{display:grid;grid-template-columns:1fr 160px 1fr;align-items:center}
.side{display:flex;align-items:center;gap:18px;min-width:0}
.side.r{flex-direction:row-reverse;text-align:right}
.side .badge{width:64px;height:64px;font-size:28px;flex:none}
.side .tname{font-size:44px}
.side .tname small{font-size:19px}
.big{font-family:var(--display);font-weight:800;font-size:96px;line-height:1;margin-left:auto}
.side.r .big{margin-left:0;margin-right:auto}
.side.lead .big{color:var(--amber)}
.vs{text-align:center;font-family:var(--display);font-size:16px;color:var(--muted);letter-spacing:.12em;display:grid;gap:6px}
.vs b{display:block;font-size:28px;line-height:1.05;color:var(--fg);letter-spacing:.04em}
.vs .h2h{border-top:1px solid var(--line);padding-top:6px}
.vs .h2h b{color:var(--amber)}
.vs .h2h small{display:block;font-size:14px;letter-spacing:.04em;margin-top:2px}
.lineup{display:grid;grid-template-columns:1fr 92px 1fr;row-gap:6px;align-content:start}
.cell{display:grid;align-items:center;background:var(--panel);height:48px;padding:0 18px;gap:14px;min-width:0}
.cell.l{grid-template-columns:1fr auto;border-radius:4px 0 0 4px}
.cell.r{grid-template-columns:auto 1fr;border-radius:0 4px 4px 0}
.cell .p{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cell .p b{font-weight:600;font-size:23px}
.cell .p i{font-style:normal;font-size:17px;color:var(--muted);margin-left:10px}
.cell.r .p{text-align:right}
.cell .v{font-family:var(--display);font-weight:700;font-size:32px;min-width:64px}
.cell.l .v{text-align:right}
.cell.live{background:var(--panel-2);box-shadow:inset 0 0 0 1px #3a2a33}
.cell.rz{box-shadow:inset 0 0 0 2px var(--rz)}
.cell.done .v{color:var(--fg)} .cell.pre .v{color:var(--muted)}
.slot{display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:20px;letter-spacing:.06em;color:var(--muted);background:var(--night);height:48px}
.rztag{font-family:var(--display);font-weight:700;font-size:15px;color:#fff;background:var(--rz);padding:1px 6px;border-radius:3px;margin-left:8px;letter-spacing:.06em}
.better{color:var(--amber)!important}

/* standings */
.split{display:grid;grid-template-columns:1.35fr 1fr;gap:34px;height:100%}
table{width:100%;border-collapse:collapse}
th{font-family:var(--display);font-weight:600;font-size:19px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);text-align:right;padding:0 12px 10px}
th:nth-child(2),td:nth-child(2){text-align:left}
td{font-size:24px;padding:0 12px;height:46px;text-align:right;border-top:1px solid var(--line)}
td:first-child,th:first-child{text-align:center;width:46px}
td.team{font-family:var(--display);font-weight:600;font-size:28px;max-width:420px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
tr.cut td{border-top:2px dashed var(--amber)}
.streak.W{color:var(--win)} .streak.L{color:var(--loss)}
.form{display:inline-flex;gap:4px;vertical-align:middle}
.form i{width:12px;height:12px;border-radius:2px;background:var(--loss)}
.form i.W{background:var(--win)}
.form i.T{background:var(--muted)}
.box{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:22px 26px;display:flex;flex-direction:column;gap:14px;min-height:0}
.box h3{margin:0;font-family:var(--display);font-weight:600;font-size:22px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.note{font-size:17px;color:var(--muted)}

/* highlights */
.hl{display:grid;grid-template-columns:1.2fr 1fr;grid-template-rows:auto 1fr;gap:24px;height:100%}
.stats3{grid-column:1/-1;display:grid;grid-template-columns:repeat(3,1fr);gap:24px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:20px 26px}
.stat h3{margin:0 0 6px;font-family:var(--display);font-weight:600;font-size:20px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.stat .num{font-family:var(--display);font-weight:800;font-size:64px;line-height:1;color:var(--amber)}
.stat .who{font-size:22px;margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rank{display:grid;grid-template-columns:40px 1fr auto;align-items:center;gap:16px;border-top:1px solid var(--line);height:52px;min-width:0}
.rank .n{font-family:var(--display);font-size:24px;color:var(--muted);text-align:center}
.rank .who{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:24px}
.rank .who b{font-weight:600}
.rank .who i{font-style:normal;color:var(--muted);font-size:18px;margin-left:10px}
.rank .v{font-family:var(--display);font-weight:700;font-size:34px}

/* weekly awards */
.awards{display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(2,1fr);gap:24px;height:100%}
.awards .stat{display:flex;flex-direction:column;justify-content:center;min-width:0}
.awards .num{font-size:80px}
.awards .who{font-size:26px;font-weight:600}
.awards .why{font-size:18px;line-height:1.3;color:var(--muted);margin-top:8px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.awards .stat.none .num{color:var(--muted)}

/* power ranking */
.up{color:var(--win)} .down{color:var(--loss)} .same{color:var(--muted)}
td.pw{font-family:var(--display);font-weight:700;font-size:30px;color:var(--amber)}

/* ticker */
/* big plays banner */
#bp{display:flex;align-items:stretch;border-bottom:1px solid var(--line);background:#0c1426;overflow:hidden}
.bplabel{flex:none;font-family:var(--display);font-weight:800;font-size:22px;letter-spacing:.12em;background:var(--rz);color:#fff;display:grid;place-items:center;padding:0 20px}
.bplabel.new{animation:bpflash .5s ease-in-out 10 alternate}
@keyframes bpflash{to{background:var(--amber);color:var(--night)}}
.bptape{flex:1;overflow:hidden;position:relative}
.bptape-in{position:absolute;top:0;left:0;height:100%;display:flex;align-items:center;white-space:nowrap;animation:tape var(--dur,80s) linear infinite}
.bptape-in.idle{animation:none}
.bpi{display:inline-flex;align-items:center;gap:12px;padding:0 28px;border-right:1px solid var(--line);font-size:21px}
.bpi .k{font-family:var(--display);font-weight:800;font-size:21px;letter-spacing:.06em;color:var(--amber);text-transform:uppercase}
.bpi .k.td{color:#fff;background:var(--rz);padding:1px 8px;border-radius:3px}
.bpi b{font-weight:600}
.bpi .m{color:var(--muted);font-size:18px}
.bpi .arrow{color:var(--muted)}
.ffw{display:inline-flex;align-items:center;gap:8px}
.ffw + .ffw{margin-left:10px}
.bpi .badge{width:28px;height:28px;font-size:12px}
.bpi .ff{font-family:var(--display);font-weight:700;font-size:22px;color:var(--amber)}
footer{border-top:1px solid var(--line);overflow:hidden;display:flex;align-items:center;background:#0c1426}
.tlabel{flex:none;font-family:var(--display);font-weight:700;font-size:22px;letter-spacing:.1em;background:var(--amber);color:var(--night);height:100%;display:grid;place-items:center;padding:0 22px}
.tape{flex:1;overflow:hidden;position:relative;height:100%}
.tape-in{position:absolute;top:0;left:0;height:100%;display:flex;align-items:center;white-space:nowrap;animation:tape var(--dur,60s) linear infinite}
@keyframes tape{to{transform:translateX(-50%)}}
.g{display:inline-flex;align-items:center;gap:12px;padding:0 30px;border-right:1px solid var(--line);font-size:22px}
.g b{font-family:var(--display);font-weight:700;font-size:26px}
.g .d{font-size:18px;color:var(--muted)}
.g.in .d{color:var(--fg)}
.g .w{color:var(--amber)}

#hint{position:absolute;right:40px;bottom:76px;font-size:16px;color:var(--muted);opacity:0;transition:opacity .4s}
#hint.on{opacity:1}
.empty{display:grid;place-items:center;height:100%;font-family:var(--display);font-size:40px;color:var(--muted);text-align:center}

/* fact of the round */
.fact{display:grid;grid-template-columns:1.15fr 1fr;gap:40px;height:100%;min-height:0}
.ftxt{display:flex;flex-direction:column;justify-content:center;min-width:0}
.kick{font-family:var(--display);font-weight:700;font-size:26px;letter-spacing:.14em;text-transform:uppercase;color:var(--amber)}
.fact h2{font-family:var(--display);font-weight:700;font-size:58px;line-height:1.06;margin:14px 0 0;text-wrap:balance}
.fact .sub{font-size:23px;line-height:1.4;color:var(--muted);margin-top:20px;max-width:760px}
.hero{display:flex;align-items:baseline;gap:16px;margin-top:34px}
.hero b{font-family:var(--display);font-weight:800;font-size:150px;line-height:.85;color:var(--amber)}
.hero span{font-family:var(--display);font-weight:600;font-size:30px;color:var(--muted);letter-spacing:.04em}
.fact .box{justify-content:center}
.fact .rank .v{font-size:30px}

@media (prefers-reduced-motion: reduce){
  .tape-in,.bptape-in{animation:none;position:static}
  .bplabel.new{animation:none}
  .view{transition:none}
  .live-dot{animation:none}
}
</style>
</head><body>

// The built-in PLAYERS list goes stale (trades, releases). Once a day, refresh name/position/team of all
// rostered players from Sleeper (their docs ask for /players/nfl at most once per day) and cache the slim result.
const PKEY = "wffl-players-v1";
// extra: further player ids (e.g. everyone rostered in past seasons, needed for positions in the optimal lineup)
async function ensurePlayers(extra){
  const c = lsGet(PKEY);
  if (!S.pCacheApplied && c && c.map) { Object.assign(PLAYERS, c.map); S.pCacheApplied = true; }
  const ids = new Set(extra || []); S.matchups.forEach(m => (m.players||[]).forEach(p => ids.add(p)));
  const fresh = c && Date.now() - c.t < 864e5;
  if (fresh && [...ids].every(id => PLAYERS[id])) return;
  if (!S.allPlayers || Date.now() - S.allT > 864e5){
    if (Date.now() - S.pTried < 36e5) return;   // at most one download per hour, also after errors
    S.pTried = Date.now();
    try { S.allPlayers = await j(`${API}/players/nfl`); S.allT = Date.now(); } catch(e){ return; }
  }
  const map = (c && c.map) || {};
  for (const id of ids){ const v = S.allPlayers[id]; if (v) map[id] = PLAYERS[id] = [v.position==="DEF" ? v.last_name : `${(v.first_name||"")[0]||""}. ${v.last_name||""}`, v.position||"", v.team||""]; }
  lsSet(PKEY, { t: fresh ? c.t : Date.now(), map });
}

const ELIG = { QB:["QB"], RB:["RB"], WR:["WR"], TE:["TE"], K:["K"], DEF:["DEF"], DL:["DL"], LB:["LB"], DB:["DB"],
  FLEX:["RB","WR","TE"], WRRB_FLEX:["WR","RB"], REC_FLEX:["WR","TE"], SUPER_FLEX:["QB","RB","WR","TE"], IDP_FLEX:["DL","LB","DB"] };
const NPOS = { DE:"DL", DT:"DL", NT:"DL", CB:"DB", S:"DB", SS:"DB", FS:"DB", ILB:"LB", OLB:"LB", MLB:"LB" };
const posOf = pid => { const p = PLAYERS[pid] && PLAYERS[pid][1]; return p ? (NPOS[p] || p) : /^[A-Z]{2,3}$/.test(pid) ? "DEF" : ""; };
const lineupSlots = rp => (rp || []).filter(p => p !== "BN" && p !== "IR" && p !== "TAXI");
// best possible lineup in hindsight: fill the most restrictive slots first with the best eligible player
function optimalPts(slots, pp){
  const pool = Object.entries(pp || {}).map(([pid, v]) => ({ pid, v: v || 0, pos: posOf(pid) })).filter(x => x.pos).sort((a, b) => b.v - a.v);
  const used = new Set(); let sum = 0;
  slots.filter(s => ELIG[s]).sort((a, b) => ELIG[a].length - ELIG[b].length).forEach(s => {
    const x = pool.find(x => !used.has(x.pid) && ELIG[s].includes(x.pos)); if (x) { used.add(x.pid); sum += x.v; } });
  return Math.round(sum * 100) / 100;
}
async function loadGames(){
  try {
    const d = await j(`${ESPN}?seasontype=2&week=${S.week}`);
    const map = {}, list = [];
    for (const e of d.events || []){
      const c = e.competitions[0], st = e.status.type;
      const teams = c.competitors.map(t => ({ abbr: ABBR_FIX[t.team.abbreviation] || t.team.abbreviation, id:t.team.id, score:+t.score||0, home:t.homeAway==="home" }));
      const sit = c.situation || {};
      const pos = teams.find(t => t.id === sit.possession);
      const g = { id: e.id, state: st.state, detail: st.shortDetail, date: new Date(e.date), teams, rz: !!sit.isRedZone, poss: pos ? pos.abbr : null };
      list.push(g); teams.forEach(t => map[t.abbr] = g);
    }
    S.games = map; S.gamesList = list.sort((a,b) => a.date - b.date);
  } catch(e){}
}

/* ---------- helpers ---------- */
function rosterById(id){ return S.rosters.find(r => r.roster_id === id); }
function team(rid){
  const r = rosterById(rid); const u = r && S.users[r.owner_id];
  const name = ((u && u.metadata && u.metadata.team_name) || (u && u.display_name) || `Team ${rid}`).trim();
  const owner = u ? u.display_name : "";
  const initials = name.replace(/[^\p{L}\p{N} ]/gu,"").split(/\s+/).filter(Boolean).slice(0,2).map(w => w[0]).join("").toUpperCase() || "?";
  // team logo from Sleeper: league team avatar first, then the manager's profile picture
  const md = (u && u.metadata) || {};
  let logo = /^https:\/\/[a-z0-9.-]*sleepercdn\.com\//i.test(md.avatar || "") ? md.avatar : (u && u.avatar ? `https://sleepercdn.com/avatars/thumbs/${encodeURIComponent(u.avatar)}` : "");
  return { name, owner, initials, logo, color: HUES[(rid-1) % HUES.length], r };
}
function badge(t){ return `<div class="badge" style="background:${t.color}">${esc(t.initials)}${t.logo ? `<img src="${esc(t.logo)}" alt="" loading="lazy" onerror="this.remove()">` : ""}</div>`; }
const weekday = new Intl.DateTimeFormat("de-DE", { weekday:"short", hour:"2-digit", minute:"2-digit" });
function gameOf(nflTeam){ return S.games[nflTeam]; }
function pStatus(pid){
  const meta = PLAYERS[pid] || [`#${pid}`, "", ""];
  const g = gameOf(meta[2]);
  // without NFL data (ESPN unreachable) we cannot tell a bye from a missing schedule
  if (!g) return { state: "post", txt: meta[2] ? (S.gamesList.length ? `${meta[2]} · Bye` : meta[2]) : "", rz:false };
  if (g.state === "pre") return { state:"pre", txt:`${meta[2]} · ${weekday.format(g.date).replace(",", "")}`, rz:false };
  if (g.state === "in") return { state:"in", txt:`${meta[2]} · ${g.detail}`, rz: g.rz && g.poss === meta[2] };
  return { state:"post", txt:`${meta[2]} · Final`, rz:false };
}
function counts(m){
  let pre=0, live=0;
  (m.starters||[]).forEach(p => { if (p==="0") return; const s = pStatus(p).state; if (s==="pre") pre++; else if (s==="in") live++; });
  return { pre, live };
}
function pairs(){
  const by = {};
  S.matchups.forEach(m => { if (m.matchup_id == null) return; (by[m.matchup_id] ||= []).push(m); });
  return Object.keys(by).sort((a,b)=>a-b).map(k => by[k].sort((a,b)=>a.roster_id-b.roster_id)).filter(p => p.length===2);
}
function openTxt(c){ const parts=[]; if (c.live) parts.push(`<span class="live-dot"></span>${c.live} live`); parts.push(`${c.pre} offen`); return parts.join(" · "); }

// form and streak from the actual results of this season (history data); Sleeper's roster metadata
// (record/streak) is not filled for every roster and is only the fallback while the history loads
function seasonForm(ownerId){
  const s = S.hist && S.hist[S.hist.length - 1]; if (!s || s.id !== LEAGUE || !ownerId) return null;
  const res = s.games.filter(g => g[1] === ownerId || g[3] === ownerId).sort((a, b) => a[0] - b[0])
    .map(([w, a, pa, b, pb]) => { const [me, op] = a === ownerId ? [pa, pb] : [pb, pa]; return me > op ? "W" : me < op ? "L" : "T"; });
  if (!res.length) return null;
  const last = res[res.length - 1]; let k = 0; for (let i = res.length - 1; i >= 0 && res[i] === last; i--) k++;
  return { rec: res.join("").slice(-5), streak: `${k}${last}` };
}

/* weekly awards: computed live from this week's matchups */
function weekAwards(){
  const ps = pairs(); if (!ps.length) return null;
  const T = S.matchups.filter(m => m.matchup_id != null);
  if (!T.some(m => (m.points || 0) > 0)) return null;
  const slots = lineupSlots(S.league.roster_positions);
  const X = T.map(m => { const p = m.points || 0, opt = Math.max(p, optimalPts(slots, m.players_points));
    const ghosts = (m.starters || []).map((pid, k) => ({ pid, v: (m.starters_points || [])[k] || 0 }))
      .filter(x => x.pid === "0" || (!x.v && S.gamesList.length && pStatus(x.pid).state === "post"));
    const st = new Set(m.starters || []); let bb = null;
    Object.entries(m.players_points || {}).forEach(([pid, v]) => { if (!st.has(pid) && (!bb || v > bb.v)) bb = { pid, v }; });
    return { m, t: team(m.roster_id), p, opt, gap: opt - p, eff: opt ? p / opt : 1, ghosts, bb }; });
  const by = Object.fromEntries(X.map(x => [x.m.roster_id, x]));
  const sorted = X.map(x => x.p).sort((a, b) => b - a), n = sorted.length;
  const med = n % 2 ? sorted[(n - 1) / 2] : (sorted[n / 2 - 1] + sorted[n / 2]) / 2;
  const duel = ps.map(([a, b]) => { const [w, l] = a.points >= b.points ? [by[a.roster_id], by[b.roster_id]] : [by[b.roster_id], by[a.roster_id]]; return { w, l }; }).filter(d => d.w.p !== d.l.p);
  const nm = x => x.t.name, pn = pid => pid === "0" ? "leerer Platz" : (PLAYERS[pid] || [pid])[0];
  const A = [];
  const effBest = X.filter(x => x.p > 0).sort((a, b) => b.eff - a.eff || b.p - a.p)[0];
  A.push(["Beste Aufstellung", effBest && Math.round(effBest.eff * 100) + "%", effBest && nm(effBest), effBest && (effBest.gap < .01 ? "die optimale Aufstellung erwischt" : `nur ${f1(effBest.gap)} Pkt. auf der Bank liegen gelassen`)]);
  const flop = [...X].sort((a, b) => b.gap - a.gap)[0];
  A.push(["Aufstellungs-Flop", flop && flop.gap > 0 && f1(flop.gap), flop && nm(flop), flop && `Punkte auf der Bank · optimal wären ${f1(flop.opt)} gewesen`]);
  const dusel = duel.filter(d => d.w.p < med).sort((a, b) => a.w.p - b.w.p)[0];
  A.push(["Dusel der Woche", dusel && f1(dusel.w.p), dusel && nm(dusel.w), dusel && `vorne gegen ${nm(dusel.l)} – trotz Score unter dem Liga-Median`]);
  const pech = duel.filter(d => d.l.p > med).sort((a, b) => b.l.p - a.l.p)[0];
  A.push(["Pech der Woche", pech && f1(pech.l.p), pech && nm(pech.l), pech && `hinten gegen ${nm(pech.w)} – damit hätte es gegen ${X.filter(x => x.p < pech.l.p).length} Teams gereicht`]);
  const gh = X.filter(x => x.ghosts.length).sort((a, b) => b.ghosts.length - a.ghosts.length)[0];
  A.push(["Geisterspieler", gh && gh.ghosts.length, gh && nm(gh), gh && `Starter mit 0 Punkten: ${gh.ghosts.map(g => pn(g.pid)).join(", ")}`]);
  const bench = X.filter(x => x.bb && x.bb.v > 0).sort((a, b) => b.bb.v - a.bb.v)[0];
  A.push(["Bankdrücker der Woche", bench && f1(bench.bb.v), bench && pn(bench.bb.pid), bench && `saß bei ${nm(bench)} auf der Bank`]);
  return A;
}

/* power ranking: current season, completed weeks (from the history data) */
function powerTable(s, upto){
  const G2 = s.games.filter(g => g[0] <= upto), SC2 = s.scores.filter(x => x[0] <= upto);
  const byW = {}; SC2.forEach(x => (byW[x[0]] ||= []).push(x[2]));
  const t = {}, get = o => (t[o] ||= { o, w: 0, l: 0, tt: 0, pf: 0, n: 0, ap: 0, apn: 0, last: [] });
  G2.forEach(([w, a, pa, b, pb]) => [[a, pa, pb], [b, pb, pa]].forEach(([o, pf, pg]) => { const x = get(o); if (pf > pg) x.w++; else if (pf < pg) x.l++; else x.tt++; }));
  SC2.forEach(([w, o, p]) => { const x = get(o), a = byW[w]; x.pf += p; x.n++; x.ap += a.filter(q => q < p).length + (a.filter(q => q === p).length - 1) / 2; x.apn += a.length - 1; x.last.push([w, p]); });
  const L = Object.values(t).filter(x => x.n); if (L.length < 3) return null;
  L.forEach(x => { x.avg = x.pf / x.n; x.apc = x.apn ? x.ap / x.apn : 0; const g = x.w + x.l + x.tt; x.wp = g ? (x.w + x.tt / 2) / g : 0;
    const l3 = x.last.sort((a, b) => a[0] - b[0]).slice(-3); x.l3 = l3.reduce((s, q) => s + q[1], 0) / l3.length; });
  const mA = Math.max(...L.map(x => x.avg)) || 1, m3 = Math.max(...L.map(x => x.l3)) || 1;
  L.forEach(x => x.score = 100 * (0.35 * x.apc + 0.35 * x.avg / mA + 0.15 * x.wp + 0.15 * x.l3 / m3));
  return L.sort((a, b) => b.score - a.score);
}
function powerData(){
  const s = S.hist && S.hist[S.hist.length - 1]; if (!s || s.id !== LEAGUE) return null;
  const weeks = [...new Set(s.games.map(g => g[0]))].sort((a, b) => a - b); if (weeks.length < 2) return null;
  const last = weeks[weeks.length - 1], now = powerTable(s, last), before = powerTable(s, weeks[weeks.length - 2]);
  return now ? { s, last, now, before } : null;
}
function vPower(){
  const P = powerData(); if (!P) return { title: "Power Ranking", dur: 4000, html: `<div class="empty">Power Ranking wird berechnet …</div>` };
  const prev = P.before ? P.before.map(x => x.o) : [];
  const rows = P.now.map((x, i) => { const r = S.rosters.find(r => r.owner_id === x.o); const t = r ? team(r.roster_id) : { name: (P.s.names[x.o] || {}).dn || "?", initials: "?", color: "#555", logo: "" };
    const pi = prev.indexOf(x.o), d = pi < 0 ? 0 : pi - i;
    const arrow = d > 0 ? `<span class="up">▲${d}</span>` : d < 0 ? `<span class="down">▼${-d}</span>` : `<span class="same">–</span>`;
    return `<tr><td>${i + 1}</td><td class="team"><div class="tb">${badge(t)}<span>${esc(t.name)}</span></div></td><td>${x.w}-${x.l}${x.tt ? "-" + x.tt : ""}</td><td>${x.avg.toFixed(1)}</td><td>${Math.round(x.apc * 100)}%</td><td>${x.l3.toFixed(1)}</td><td class="pw">${x.score.toFixed(1)}</td><td>${arrow}</td></tr>`; }).join("");
  return { title: `Power Ranking · nach Woche ${P.last}`, dur: DUR.power, html: `<div style="min-width:0"><table><thead><tr><th>#</th><th>Team</th><th>W-L</th><th>Ø Pkt</th><th>All-Play</th><th>Ø letzte 3</th><th>Power</th><th>Trend</th></tr></thead><tbody>${rows}</tbody></table>
    <p class="note">Power = 35 % All-Play-Quote (Bilanz, wenn man jede Woche gegen alle spielt) + 35 % Punkteschnitt + 15 % echte Siegquote + 15 % Form der letzten 3 Wochen. Trend gegenüber der Vorwoche.</p></div>` };
}

function buildViews(){
  if (!S.league || !S.matchups.length) return [];
  const v = [vOverview], ps = pairs();
  ps.forEach((p,i) => { const f = () => vDuel(p[0], p[1], i); f.key = "duel" + i; v.push(f); });
  v.splice(4, 0, vStandings);
  if (powerData()) v.splice(5, 0, vPower);
  v.push(vHighlights);
  if (weekAwards()) v.push(vOscars);
  if (S.facts.length) v.push(vFact);   // one fact per round
  if (S.facts.length && S.week === RIV_WEEK) v.splice(1, 0, vRivalFact);   // Rivalry Week: extra rivalry slot
  return v;
}
